  #linkBtn, #linkSolo, #manual, #kontrola, #pristi { display: none !important; }
  #loadnote { margin: 8px 0 0; min-height: 1.1em; }
  table.hm td.hc { animation-delay: calc(min(var(--i), 40) * 18ms); }
  .debut { margin: 0 0 14px; font-size: .95rem; }
  .debut b:first-child { margin-right: 6px; }
  .sctl { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin: 0 0 12px; }
  .sctl label { font-size: .8rem; color: var(--muted); font-weight: 600; }
  .sctl select { width: auto; }
  .sctl .chk { display: flex; gap: 6px; align-items: center; font-weight: 400; }
  table.ser th.l, table.ser td.l { text-align: left; }
  table.ser th::after { content: none !important; }
  table.ser { table-layout: auto; }
  table.ser td.skc { position: relative; min-width: 80px; }
  .seg.tools button { font-size: .95rem; }
  .mic { display: inline-block; width: 1.8em; height: 1.8em; line-height: 1.8em; border-radius: 3px; text-align: center; font: 700 .78rem var(--f-chalk); }
  .mic.ic-g { background: var(--blue); color: #fff; } .mic.ic-b { background: var(--chalk); color: var(--board); } .mic.ic-z { border: 1.5px solid var(--line); color: var(--muted); line-height: 1.55em; }
  .kmob { display: none; font-size: .8rem; }
  @media (max-width: 640px) { .kmob { display: inline; } table.ser th, table.ser td { padding: 6px 4px; } }
  table.ser td.skc .skb { position: absolute; right: 0; top: 4px; bottom: 4px; background: var(--bar); z-index: 0; }
  table.ser td.skc b { position: relative; font-size: 1.15rem; }
  .zpick { display: flex; gap: 12px; align-items: flex-end; margin: 0 0 12px; flex-wrap: wrap; }
  .zpick > div { flex: 1 1 200px; }
  .zpick label { display: block; font-size: .8rem; color: var(--muted); font-weight: 600; }
  .zcols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 32px; }
  @media (max-width: 900px) { .zcols { grid-template-columns: 1fr; } }

<script>
(function(){
if(window.BILANCE_EMBED||/(^|[#&])solo=1/.test(location.hash))document.documentElement.className+=' solo';
var KEY='bilanceProtiTymum.v1', db={};
try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){db={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var prow=[],prowAll=[],CUR=0,CISLA={},pick='tiles',mode='P',EMB={},KONTR={},META={},sortKey=null,sortDir=-1;
var KLUB={},IDS={},INF={},CLUBS=[];
function A(){var o={},k=$('klub')?$('klub').value:'',n;for(n in EMB)if(!k||KLUB[n]===k)o[n]=EMB[n];return o}
function clubName(n){var k=KLUB[n];return TEAMS[k]||k||''}
function INFR(n){var r=INF[n];if(!r){r=EMB[n].map(function(x){return Object.assign({},x)});inferTeams(r,KLUB[n]);INF[n]=r}return r}

var TEAMS={SLA:'Slavia',CEB:'České Budějovice',KLA:'Kladno',VIT:'Vítkovice',LIB:'Liberec',PLZ:'Plzeň',KOM:'Kometa Brno',SPA:'Sparta',PCE:'Pardubice',LIT:'Litvínov',KVA:'Karlovy Vary',OLO:'Olomouc',MHK:'Hradec Králové',MBL:'Mladá Boleslav',TRI:'Třinec',ZLN:'Zlín',CHM:'Chomutov',JIH:'Jihlava',ZNO:'Znojmo'};
var TEAMCOL={CEB:['#d4202b','#1f5fb4','#f2b705'],SPA:['#8c1230','#111827'],SLA:['#d4202b','#ffffff'],KOM:['#1f5fb4','#ffffff'],TRI:['#ffffff','#d4202b'],PCE:['#d4202b','#ffffff','#1f5fb4'],PLZ:['#ffffff','#1f5fb4'],LIB:['#1f9ad6','#ffffff'],VIT:['#1b3a7a','#ffffff'],MHK:['#f2b705','#d4202b','#ffffff'],KVA:['#8a93a3','#ffffff'],OLO:['#d4202b','#ffffff'],MBL:['#1f8a4c','#ffffff'],LIT:['#f2b705','#111827'],KLA:['#1f5fb4','#ffffff'],CHM:['#d4202b','#8a93a3'],ZLN:['#f2b705','#1f5fb4'],JIH:['#f2b705','#d4202b'],ZNO:['#d4202b','#ffffff','#7a4a2b']};
function tcs(c){var a=TEAMCOL[c]||['#94a3b8'],g;
  if(a.length===1)g=a[0];else if(a.length===2)g='linear-gradient(135deg,'+a[0]+' 0 50%,'+a[1]+' 50% 100%)';
  else g='conic-gradient(from 45deg,'+a[0]+' 0 33.4%,'+a[1]+' 0 66.7%,'+a[2]+' 0)';
  return g}
function tdot(c){return '<i class="tdot" style="--tg:'+tcs(c)+'"></i>'}
function teamCell(c){return tdot(c)+'<b>'+c+'</b>'+(TEAMS[c]?'<span class="full">'+TEAMS[c]+'</span>':'')}
function teamName(c){return TEAMS[c]?c+' – '+TEAMS[c]:c}

function seasonOf(d){return d.m>=7?d.y:d.y-1}
function parseRows(txt){
  var out=[],bad=0;
  txt.split(/\r?\n/).forEach(function(line){
    var c=line.split('\t'); if(c.length<9)c=line.trim().split(/\s{2,}/);
    var m=(c[0]||'').trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    if(!m){if(line.trim()&&!/datum/i.test(line))bad++;return}
    var teams=(c[3]||'').split(/\s*[–—-]\s*/);
    if(teams.length!==2){bad++;return}
    var sk=(c[4]||'').trim().match(/(\d+)\s*:\s*(\d+)/);
    var n=function(i){var v=parseInt(String(c[i]||'0').replace('−','-'),10);return isNaN(v)?0:v};
    var toi=(c[10]||'').trim().match(/(\d+):(\d+)/);
    var d={y:+m[3],m:+m[2],d:+m[1]};
    out.push({dt:m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2),season:seasonOf(d),
      kolo:(c[1]||'').trim(),comp:(c[2]||'').trim(),a:teams[0].trim(),b:teams[1].trim(),
      sa:sk?+sk[1]:null,sb:sk?+sk[2]:null,ot:/\s(P|N|SN)\s*$/.test(c[4]||''),
      g:n(5),as:n(6),p:n(7),pm:n(8),tm:n(9),toi:toi?+toi[1]*60+ +toi[2]:0});
  });
  return {rows:out,bad:bad};
}

// odvodí tým hráče: běh po sobě jdoucích zápasů sdílí společný tým
function inferTeams(rows,home){
  var bySeason={};
  rows.forEach(function(r){r.team=null;r.amb=false;(bySeason[r.season]=bySeason[r.season]||[]).push(r)});
  Object.keys(bySeason).forEach(function(k){
    var g=bySeason[k].sort(function(x,y){return x.dt<y.dt?-1:1}),run=[],cand=null;
    function flush(){
      if(!run.length)return;
      var t=cand&&cand.length===1?cand[0]:null;
      run.forEach(function(r){r.team=t;r.amb=!t});
      run=[];cand=null;
    }
    g.forEach(function(r){
      var s=[r.a,r.b];
      if(cand===null){cand=s;run=[r];return}
      var inter=cand.filter(function(x){return s.indexOf(x)>-1});
      if(inter.length){cand=inter;run.push(r)}else{flush();cand=s;run=[r]}
    });
    flush();
  });
  // ruční určení týmu (bilance_rucne.json) a pravidlo: nejednoznačný zápas
  // aktuální sezóny proti CEB hrál hráč Motoru za Motor
  rows.forEach(function(r){
    if(r.fix&&(r.fix===r.a||r.fix===r.b)){r.team=r.fix;r.amb=false}
    else if(r.amb&&home&&r.season===CUR&&(r.a===home||r.b===home)){r.team=home;r.amb=false}
  });
  rows.forEach(function(r){r.mine=!!home&&r.team===home});
  // zbylé nejasné zápasy: tým z nejbližšího jasného zápasu (dřív, jinak později), pokud v tom zápase hrál
  var srt=rows.slice().sort(function(x,y){return x.dt<y.dt?-1:x.dt>y.dt?1:0});
  srt.forEach(function(r,i){
    if(r.team||!r.amb)return;
    var j,t=null;
    for(j=i-1;j>=0;j--)if(srt[j].team){t=srt[j].team;break}
    if(t!==r.a&&t!==r.b){t=null;for(j=i+1;j<srt.length;j++)if(srt[j].team){t=srt[j].team;break}}
    if(t===r.a||t===r.b){r.team=t;r.amb=false;r.odhad=true}
  });
}
function opp(r){return r.team?(r.team===r.a?r.b:r.a):null}
function won(r){ if(r.sa==null||!r.team)return null; var mine=r.team===r.a?r.sa:r.sb,th=r.team===r.a?r.sb:r.sa; return mine>th}

$('add').onclick=function(){
  var nm=$('name').value.trim(); if(!nm){$('msg').textContent='Doplň jméno hráče.';return}
  var p=parseRows($('paste').value); if(!p.rows.length){$('msg').textContent='Nenašel jsem žádné řádky zápasů (očekávám tabulátory a datum jako 18.10.2026).';return}
  var cur=db[nm]=db[nm]||[],have={},added=0;
  cur.forEach(function(r){have[r.dt+r.a+r.b]=1});
  p.rows.forEach(function(r){var k=r.dt+r.a+r.b;if(!have[k]){have[k]=1;cur.push(r);added++}});
  save();$('paste').value='';
  $('msg').textContent='Přidáno '+added+' zápasů ('+(p.rows.length-added)+' duplicit přeskočeno'+(p.bad?', '+p.bad+' řádků nerozpoznáno':'')+').';
  refresh(nm);
};
$('del').onclick=function(){var n=$('name').value.trim()||$('player').value;if(n&&EMB[n]&&!db[n]){alert('Tohle je hráč z automaticky stahovaných dat, smazat jde jen ručně vložené.');return}if(n&&db[n]&&confirm('Smazat '+n+'?')){delete db[n];save();refresh()}};
$('exp').onclick=function(){var t=JSON.stringify(db);try{navigator.clipboard.writeText(t);$('msg').textContent='Export zkopírován do schránky.'}catch(e){prompt('Zkopíruj:',t)}};
$('imp').onclick=function(){var t=prompt('Vlož exportovaný JSON:');if(!t)return;try{var o=JSON.parse(t);for(var k in o)db[k]=o[k];save();refresh()}catch(e){alert('Neplatný JSON')}};
function markTabs(){['P','T','H','G','S','Z'].forEach(function(k){$('tab'+k).className=k===mode?'on':''})}
function setMode(m){mode=m;markTabs();sortKey=null;refresh()}
$('tabP').onclick=function(){setMode('P')};
$('tabT').onclick=function(){setMode('T')};
$('tabH').onclick=function(){setMode('H')};
$('tabG').onclick=function(){setMode('G')};
$('tabS').onclick=function(){setMode('S')};
$('tabZ').onclick=function(){setMode('Z')};
['player','opp','season','comp','club','kde'].forEach(function(i){$(i).onchange=function(){render();if(i==='club'||i==='kde'){pristiHtml();rekordyHtml(true)}}});

function fill(sel,vals,keep,all){
  var h=(all?'<option value="">'+all+'</option>':'')+vals.map(function(v){return '<option value="'+v+'">'+(sel.id==='opp'?teamName(v):v)+'</option>'}).join('');
  sel.innerHTML=h; if(keep!=null&&((keep===''&&all)||vals.indexOf(keep)>-1))sel.value=keep;
}
try{var pk=localStorage.getItem('bilancePick');if(pk==='sel'||pk==='tiles')pick=pk}catch(e){}
var LASTFMT={};
function nameParts(n){var q=n.replace(/ \([A-Z]{2,4}\)$/,'').split(' ');
  if(LASTFMT[n]&&q.length>1)return {sur:q[q.length-1],first:q.slice(0,-1).join(' ')};
  return {sur:q[0],first:q.slice(1).join(' ')}}
function surname(n){return nameParts(n).sur}
function byName(a,b){var x=nameParts(a).sur,y=nameParts(b).sur;return x<y?-1:x>y?1:(a<b?-1:a>b?1:0)}
function chipsHtml(){
  var h='',cur;
  if(mode==='P'){
    cur=$('player').value;
    var names=Object.keys(A()).sort(function(a,b){
      var x=CISLA[a],y=CISLA[b];
      if(x==null&&y==null)return byName(a,b);if(x==null)return 1;if(y==null)return -1;
      return (x-y)||byName(a,b);
    });
    names.forEach(function(n){h+='<button type="button" class="chip'+(n===cur?' on':'')+'" data-v="'+n+'" title="'+n+'"><span class="no">'+(KLUB[n]&&!$('klub').value?KLUB[n]:'&nbsp;')+'</span><b>'+surname(n)+'</b></button>'});
  }else{
    cur=$('opp').value;
    Array.prototype.forEach.call($('opp').options,function(o){var c=o.value;h+='<button type="button" class="chip'+(c===cur?' on':'')+'" style="--tg:'+tcs(c)+'" data-v="'+c+'"><span class="no">'+c+'</span><b>'+(TEAMS[c]||c)+'</b></button>'});
  }
  $('chips').innerHTML=h;
  var bs=$('chips').querySelectorAll('.chip');
  for(var i=0;i<bs.length;i++)(function(b){b.onclick=function(){
    var sel=mode==='P'?$('player'):$('opp');sel.value=b.getAttribute('data-v');render();
    try{$('tblTitle').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){try{$('tblTitle').scrollIntoView(true)}catch(e2){}}
  }})(bs[i]);
}
function applyPick(){
  var tiles=pick==='tiles';
  $('chips').style.display=tiles?'':'none';
  $('pmTiles').className=tiles?'on':'';$('pmSel').className=tiles?'':'on';
  $('player').style.display=(!tiles&&mode==='P')?'':'none';
  $('opp').style.display=(!tiles&&mode==='T')?'':'none';
}
(function(){
  var root=document.documentElement,mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
  function cur(){return root.getAttribute('data-theme')||'light'}
  function paint(){var d=cur()==='dark';$('themeBtn').textContent=d?'☀':'☾';var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',d?'#1e2b26':'#ffffff')}
  try{var sv=localStorage.getItem('bilanceTheme');if(sv==='dark'||sv==='light')root.setAttribute('data-theme',sv)}catch(e){}
  $('themeBtn').onclick=function(){var n=cur()==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('bilanceTheme',n)}catch(e){}paint()};
  paint();
})();
$('pmTiles').onclick=function(){pick='tiles';try{localStorage.setItem('bilancePick',pick)}catch(e){}applyPick();render()};
$('pmSel').onclick=function(){pick='sel';try{localStorage.setItem('bilancePick',pick)}catch(e){}applyPick();render()};
function seasonLabel(s){return s+'/'+String(+s+1).slice(2)}
function refresh(sel){
  var AA=A(),names=Object.keys(AA).sort(byName),keep=sel||$('player').value;
  fill($('player'),names,keep);
  var seasons={},comps={};
  names.forEach(function(n){AA[n].forEach(function(r){seasons[r.season]=1;comps[r.comp]=1})});
  CUR=0;for(var cs in seasons)CUR=Math.max(CUR,+cs);INF={};INFGC={};
  var keepS=$('season').value;
  var sv=Object.keys(seasons).map(Number).sort(function(a,b){return b-a}).map(String);
  $('season').innerHTML='<option value="">Všechny sezóny</option>'+sv.map(function(v){return '<option value="'+v+'">'+seasonLabel(v)+'</option>'}).join('');
  if(keepS===''||sv.indexOf(keepS)>-1)$('season').value=keepS;
  fill($('comp'),Object.keys(comps).sort(),$('comp').value,'Všechny soutěže');
  var teams={};names.forEach(function(n){INFR(n).forEach(function(x){var o=opp(x);if(o)teams[o]=1})});
  var tv=Object.keys(teams).sort(function(a,b){return teamName(a)<teamName(b)?-1:1});
  fill($('opp'),tv,$('opp').value);
  applyPick();
  $('mainLabel').textContent=mode==='P'?'Hráč':'Soupeř';$('mainLabel').setAttribute('for',mode==='P'?'player':'opp');
  render();
}
function whereOk(r){var k=$('kde').value;if(!k)return true;if(!r.team)return false;var home=r.team===r.a;return k==='D'?home:!home}
function clubOk(r){var k=$('club').value;return !k||(k==='H'?r.mine:!r.mine)}
function filt(n,noWhere){
  var rows=INFR(n);
  var s=$('season').value,c=$('comp').value;
  return rows.filter(function(r){return (!s||String(r.season)===s)&&(!c||r.comp===c)&&clubOk(r)&&(noWhere||whereOk(r))});
}
function agg(rows){
  var t={z:0,g:0,a:0,b:0,pm:0,tm:0,toi:0,toiz:0,w:0,l:0};
  rows.forEach(function(r){t.z++;t.g+=r.g;t.a+=r.as;t.b+=r.p;t.pm+=r.pm;t.tm+=r.tm;if(r.toi){t.toi+=r.toi;t.toiz++}var w=won(r);if(w===true)t.w++;else if(w===false)t.l++});
  return t;
}
function fmtPm(v){return '<span class="'+(v>0?'pos':v<0?'neg':'')+'">'+(v>0?'+'+v:v)+'</span>'}
function fmtToi(t){if(!t.toiz)return '–';var a=Math.round(t.toi/t.toiz);return Math.floor(a/60)+':'+('0'+a%60).slice(-2)}
function bg(v,max){if(!max||v<=0)return '';var p=Math.max(4,Math.round(100*v/max));return ' style="background:linear-gradient(90deg,var(--bar) '+p+'%,transparent '+p+'%)"'}
function wlHtml(t){return t.w+'–'+t.l}
function rowHtml(label,t,cls,maxB){
  return '<tr class="'+(cls||'')+'"><td class="opp">'+label+'</td><td>'+t.z+'</td><td class="gab g'+(t.g?'':' zero')+'">'+t.g+'</td><td class="gab a'+(t.a?'':' zero')+'">'+t.a+'</td><td class="gab pts'+(t.b?'':' zero')+'"'+(cls?'':bg(t.b,maxB))+'>'+t.b+'</td><td class="hide-m">'+(t.z?(t.b/t.z).toFixed(2):'–')+'</td><td>'+fmtPm(t.pm)+'</td><td class="hide-m">'+t.tm+'</td><td class="hide-m">'+fmtToi(t)+'</td><td class="hide-m">'+wlHtml(t)+'</td></tr>';
}
var COLS=[['Z','z'],['G','g','gab'],['A','a','gab'],['B','b','gab'],['B/Z','bz','hide-m'],['+/-','pm'],['TM','tm','hide-m'],['TOI Ø','toi','hide-m'],['V–P','w','hide-m']];
function headHtml(first){

function milGrid(k,max){var out=[],v;
  if(k==='z'){if(max>=1)out.push(1);for(v=100;v<=max;v+=100)out.push(v)}
  else if(k==='g'){[1,25,50].forEach(function(x){if(x<=max)out.push(x)});for(v=100;v<=max;v+=50)out.push(v)}
  else{[1,50].forEach(function(x){if(x<=max)out.push(x)});for(v=100;v<=max;v+=100)out.push(v)}
  return out}
function milNext(k,cur){var v=cur+1;
  if(k==='z')return v<=1?1:Math.ceil(v/100)*100;
  if(k==='g'){if(v<=1)return 1;if(v<=25)return 25;if(v<=50)return 50;return Math.ceil(v/50)*50}
  if(v<=1)return 1;if(v<=50)return 50;if(v<=100)return 100;return Math.ceil(v/100)*100}
function milCalc(n){
  var comp=$('comp').value,rows=allRowsFor(n).filter(function(r){return !comp||r.comp===comp});
  rows.sort(function(x,y){return x.dt<y.dt?-1:x.dt>y.dt?1:0});
  var cum={z:0,g:0,b:0},T={z:[],g:[],b:[]},items=[],i,k,pos={z:0,g:0,b:0};
  var tot={z:rows.length,g:0,b:0};rows.forEach(function(r){tot.g+=r.g;tot.b+=r.p});
  ['z','g','b'].forEach(function(kk){T[kk]=milGrid(kk,tot[kk])});
  rows.forEach(function(r){
    var add={z:1,g:r.g,b:r.p};
    ['z','g','b'].forEach(function(kk){
      cum[kk]+=add[kk];
      while(pos[kk]<T[kk].length&&cum[kk]>=T[kk][pos[kk]]){items.push({k:kk,n:T[kk][pos[kk]],r:r,add:add[kk],cum:cum[kk]});pos[kk]++}
    });

}

var GCOLS=[['Z','z'],['Min','min'],['Zák.','sv'],['Obd.','ga'],['Úsp. %','svp'],['GAA','gaa'],['SO','so'],['V–P','w']];
function gRow(label,t,cls){
  return '<tr class="'+(cls||'')+'"><td class="opp">'+label+'</td><td>'+t.z+'</td><td>'+Math.round(t.min)+'</td><td>'+t.sv+'</td><td>'+t.ga+'</td><td class="pts">'+(t.sh?t.svp.toFixed(1):'–')+'</td><td>'+(t.min?t.gaa.toFixed(2):'–')+'</td><td>'+t.so+'</td><td>'+t.w+'–'+t.l+'</td></tr>';
}
function gTable(first,items,total){
  var d=items.slice().sort(function(x,y){
    if(GS.sk==='k')return GS.sd*(x.k<y.k?-1:x.k>y.k?1:0)*-1;
    var a=x.t[GS.sk],b=y.t[GS.sk];return (GS.sd*(a<b?-1:a>b?1:0))||(y.t.z-x.t.z)||(x.k<y.k?-1:1);
  });
  var h='<div class="tblwrap"><table><thead><tr><th data-k="k" style="text-align:left">'+first+'</th>'+GCOLS.map(function(c){return '<th data-k="'+c[1]+'" class="'+(GS.sk===c[1]?(GS.sd<0?'desc':'asc'):'')+'">'+c[0]+'</th>'}).join('')+'</tr></thead><tbody>'
   +d.map(function(x){return gRow(x.label,x.t)}).join('')+(total?gRow('Celkem',total,'tot'):'')+'</tbody></table></div>';
  return h;
}
function gTiles(t){
  function tl(v,l){return '<div class="tile"><b>'+v+'</b><span>'+l+'</span></div>'}
  return '<div class="tiles">'+tl(t.z,'Zápasů')+tl(Math.round(t.min),'Minut')+tl(t.sh?t.svp.toFixed(1)+' %':'–','Úspěšnost')+tl(t.min?t.gaa.toFixed(2):'–','GAA')+tl(t.so,'Nuly')+'</div>';
}
function renderG(){
  var el=$('gcard'),names=gNames();
  if(!names.length){el.innerHTML='<h2>Brankáři</h2><p class="muted">Pro tento výběr nejsou data brankářů. Brankáře ukládá až aktuální import — nahraj soubory ze stahovátka znovu.</p>';return}
  var teams={};names.forEach(function(n){INFG(n).forEach(function(r){var o=opp(r);if(o)teams[o]=1})});
  var tl=Object.keys(teams).sort(function(a,b){return teamName(a)<teamName(b)?-1:1});
  if(names.indexOf(GS.who)<0)GS.who=names[0];
  if(tl.indexOf(GS.opp)<0)GS.opp=tl[0]||'';
  var h='<h2>Brankáři — bilance proti týmům</h2><div class="seg sub"><button type="button" id="gvB" class="'+(GS.view==='B'?'on':'')+'">Podle brankáře</button><button type="button" id="gvS" class="'+(GS.view==='S'?'on':'')+'">Podle soupeře</button></div>';
  var note='<p class="small muted">Úsp. % = zákroky / (zákroky + obdržené góly), GAA = obdržené góly na 60 minut, SO = zápas bez obdrženého gólu při odchytání aspoň 55 minut. V–P je výsledek týmu v zápase, ve kterém chytal. Filtry sezóna, soutěž, „hráč za“ a doma/venku platí i tady.</p>';
  if(GS.view==='B'){
    h+='<select id="gSel" class="gsel">'+names.map(function(n){return '<option value="'+n+'"'+(n===GS.who?' selected':'')+'>'+n+(KLUBG[n]?' ('+KLUBG[n]+')':'')+'</option>'}).join('')+'</select>';
    var rows=gFilt(GS.who),by={};rows.forEach(function(r){var o=opp(r);if(o)(by[o]=by[o]||[]).push(r)});
    var items=Object.keys(by).map(function(o){return {k:o,label:teamCell(o),t:gAgg(by[o])}});
    h+=gTiles(gAgg(rows))+gTable('Soupeř',items,gAgg(rows));
  }else{
    h+='<select id="gOpp" class="gsel">'+tl.map(function(t){return '<option value="'+t+'"'+(t===GS.opp?' selected':'')+'>'+teamName(t)+'</option>'}).join('')+'</select>';
    var items2=[],all=[];
    names.forEach(function(n){var rs=gFilt(n).filter(function(r){return opp(r)===GS.opp});if(rs.length){all=all.concat(rs);items2.push({k:n,label:'<a class="pl" data-g="'+n+'">'+n+'</a>',t:gAgg(rs)})}});
    h+=gTiles(gAgg(all))+gTable('Brankář',items2,null);
  }
  var pairs=[];names.forEach(function(n){var by2={};gFilt(n).forEach(function(r){var o=opp(r);if(o)(by2[o]=by2[o]||[]).push(r)});Object.keys(by2).forEach(function(o){var t=gAgg(by2[o]);if(t.z>=3&&t.sh)pairs.push({n:n,o:o,t:t})})});
  function li(x,v){return '<li><span><a class="pl" data-g="'+x.n+'">'+x.n+'</a> <span class="s">proti '+(TEAMS[x.o]||x.o)+' · '+x.t.z+' z.</span></span><span class="v">'+v+'</span></li>'}
  if(pairs.length){
    var best=pairs.slice().sort(function(a,b){return b.t.svp-a.t.svp}).slice(0,5),worst=pairs.slice().sort(function(a,b){return a.t.svp-b.t.svp}).slice(0,5),so=pairs.filter(function(x){return x.t.so>0}).sort(function(a,b){return b.t.so-a.t.so}).slice(0,5);
    h+='<h3 style="margin:18px 0 6px;font-size:.72rem;text-transform:uppercase;color:var(--muted)">Nejlepší a nejhorší proti jednomu týmu (min. 3 zápasy)</h3><div class="cols"><div><h3>Nejvyšší úspěšnost</h3><ol class="rank">'+best.map(function(x){return li(x,x.t.svp.toFixed(1)+' %')}).join('')+'</ol></div><div><h3>Nejnižší úspěšnost</h3><ol class="rank">'+worst.map(function(x){return li(x,x.t.svp.toFixed(1)+' %')}).join('')+'</ol></div>'+(so.length?'<div><h3>Nejvíc nul</h3><ol class="rank">'+so.map(function(x){return li(x,x.t.so+'×')}).join('')+'</ol></div>':'')+'</div>';
  }
  el.innerHTML=h+note;
  $('gvB').onclick=function(){GS.view='B';GS.sk='z';GS.sd=-1;renderG()};
  $('gvS').onclick=function(){GS.view='S';GS.sk='z';GS.sd=-1;renderG()};
  if($('gSel'))$('gSel').onchange=function(){GS.who=this.value;renderG()};
  if($('gOpp'))$('gOpp').onchange=function(){GS.opp=this.value;renderG()};
  Array.prototype.forEach.call(el.querySelectorAll('th'),function(th){th.onclick=function(){var k=th.getAttribute('data-k');GS.sd=GS.sk===k?-GS.sd:(k==='k'?1:-1);GS.sk=k;renderG()}});
  Array.prototype.forEach.call(el.querySelectorAll('a.pl[data-g]'),function(a){a.onclick=function(){GS.who=a.getAttribute('data-g');GS.view='B';GS.sk='z';GS.sd=-1;renderG();try{el.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}}});
}

/* ====== analýzy: série, forma, proti soupeři, milníky ====== */
var SS={tool:'S',view:'P',min:{P:3,D:5},old:false,fN:5,fV:'B',oMin:5,oDir:'up',mK:'b',mLeft:25,mBig:true,dS:''};
var TOOLS=[['S','Série'],['F','Forma'],['O','Proti soupeři'],['M','Milníky'],['D','Debuty']];
function dShort(d){var m=String(d).match(/^(\d{4})-(\d\d)-(\d\d)/);return m?(+m[3])+'. '+(+m[2])+'.':''}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function sortedCur(n,c){return INFR(n).filter(function(r){return r.season===CUR&&(!c||r.comp===c)}).sort(function(x,y){return x.dt<y.dt?-1:x.dt>y.dt?1:0})}
function klubCell(n){return KLUB[n]?tdot(KLUB[n])+'<b>'+KLUB[n]+'</b>':''}
function sel(id,vals,cur,fmt){return '<select id="'+id+'">'+vals.map(function(v){return '<option value="'+v+'"'+(String(v)===String(cur)?' selected':'')+'>'+fmt(v)+'</option>'}).join('')+'</select>'}
function segHtml(id,items,cur){return '<div class="seg sub" id="'+id+'">'+items.map(function(x){return '<button type="button" data-v="'+x[0]+'" class="'+(x[0]===cur?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>'}
function signed(v,d){var s=(v>0?'+':'')+v.toFixed(d==null?2:d);return '<span class="'+(v>0.0001?'pos':v<-0.0001?'neg':'')+'">'+s.replace('-','−')+'</span>'}
function diffNote(cutoff){return !cutoff?($('klub').value?'Teď jen '+clubName(Object.keys(A())[0]||'')+' – pro celou ligu vyber nahoře „Celá liga“.':''):$('klub').value?'Teď jen '+clubName(Object.keys(A())[0]||'')+' – pro celou ligu vyber nahoře „Celá liga“.':'Poslední zápas v datech: '+dShort(cutoff)+'.'}

function seriesData(){
  var AA=A(),c=$('comp').value,out=[],last='';
  Object.keys(AA).forEach(function(n){
    var rs=sortedCur(n,c);if(!rs.length)return;
    var lastR=rs[rs.length-1];if(lastR.dt>last)last=lastR.dt;
    var want=SS.view==='P',k=0;
    while(k<rs.length&&(rs[rs.length-1-k].p>0)===want)k++;
    if(!k)return;
    var ser=rs.slice(rs.length-k);
    out.push({n:n,k:k,t:agg(ser),from:ser[0].dt,last:lastR,o:opp(lastR),z:rs.length});
  });
  return {rows:out,last:last};
}
function oldBox(old){return old?'<label class="chk"><input type="checkbox" id="sOld"'+(SS.old?' checked':'')+'> i hráči, kteří už nehrají (skrytých '+old+')</label>':''}
function toolSeries(){
  var P=SS.view==='P',mn=SS.min[SS.view];
  var D=seriesData(),cutoff=D.last;
  var all=D.rows.filter(function(x){return x.k>=mn});
  var live=all.filter(function(x){return daysBetween(x.last.dt,cutoff)<=10}),old=all.length-live.length;
  var rows=(SS.old?all:live).slice().sort(function(a,b){return (b.k-a.k)||(P?(b.t.b-a.t.b):(b.z-a.z))||(a.n<b.n?-1:1)});
  var maxK=rows.length?rows[0].k:1;
  var h=segHtml('svSeg',[['P','S bodem'],['D','Bez bodu']],SS.view);
  h+='<div class="sctl"><label for="sMin">Série od</label>'+sel('sMin',[2,3,4,5,6,8,10,15],mn,function(v){return v+' zápasů'})+oldBox(old)+'</div>';
  if(!rows.length)h+='<p class="muted">V aktuální sezóně není žádný hráč se sérií '+(P?'s bodem':'bez bodu')+' aspoň '+mn+' zápasů.</p>';
  else{
    h+='<div class="tblwrap"><table class="ser"><thead><tr><th class="l">#</th><th class="l">Hráč</th><th class="l hide-m">Klub</th><th>Série</th>'
      +(P?'<th class="gab" style="color:var(--blue)">G</th><th class="gab" style="color:var(--y)">A</th><th class="gab">B</th><th class="hide-m">B/z</th>':'<th class="hide-m">Zápasů celkem</th><th>+/-</th><th class="hide-m">TOI Ø</th>')
      +'<th class="l hide-m">Od</th><th class="l">Poslední zápas</th></tr></thead><tbody>';
    rows.forEach(function(x,i){
      var t=x.t,w=Math.max(4,Math.round(x.k/maxK*100));
      h+='<tr><td class="l muted">'+(i+1)+'</td><td class="l"><b>'+plink(x.n)+'</b><span class="kmob muted"> '+(KLUB[x.n]||'')+'</span></td><td class="l hide-m">'+klubCell(x.n)+'</td>'
        +'<td class="skc"><span class="skb" style="width:'+w+'%"></span><b>'+x.k+'</b> z.</td>'
        +(P?'<td class="gab g'+(t.g?'':' zero')+'">'+t.g+'</td><td class="gab a'+(t.a?'':' zero')+'">'+t.a+'</td><td class="gab pts">'+t.b+'</td><td class="hide-m">'+(t.b/x.k).toFixed(2)+'</td>'
          :'<td class="hide-m">'+x.z+'</td><td>'+fmtPm(t.pm)+'</td><td class="hide-m">'+fmtToi(t)+'</td>')
        +'<td class="l hide-m">'+dShort(x.from)+'</td><td class="l">'+dShort(x.last.dt)+(x.o?' <span class="muted">'+x.o+'</span>':'')+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='<p class="small muted">Řada zápasů v aktuální sezóně ('+seasonLabel(CUR)+') zakončená posledním odehraným zápasem hráče; počítají se i play off. '+diffNote(cutoff)+'</p>';
  return {h:h,bind:function(){
    segBind('svSeg',function(v){SS.view=v});
    $('sMin').onchange=function(){SS.min[SS.view]=+$('sMin').value;renderS()};
    if($('sOld'))$('sOld').onchange=function(){SS.old=$('sOld').checked;renderS()};
  }};
}

function toolForma(){
  var N=SS.fN,V=SS.fV,AA=A(),c=$('comp').value,rows=[],last='';
  Object.keys(AA).forEach(function(n){
    var rs=sortedCur(n,c);if(!rs.length)return;
    var lr=rs[rs.length-1];if(lr.dt>last)last=lr.dt;
    if(rs.length<N)return;
    var win=rs.slice(-N),pre=rs.slice(0,-N),t=agg(win),pt=pre.length>=N?agg(pre):null;
    var rec=t.b/N,prev=pt?pt.b/pt.z:null;
    rows.push({n:n,t:t,rec:rec,prev:prev,d:prev==null?null:rec-prev,last:lr,sz:rs.length});
  });
  var live=rows.filter(function(x){return daysBetween(x.last.dt,last)<=10}),old=rows.length-live.length;
  var base=SS.old?rows:live;
  if(V==='B')base=base.slice().sort(function(a,b){return (b.t.b-a.t.b)||(b.t.g-a.t.g)||(a.n<b.n?-1:1)});
  else if(V==='U')base=base.filter(function(x){return x.d!=null&&x.d>0}).sort(function(a,b){return (b.d-a.d)||(b.t.b-a.t.b)});
  else base=base.filter(function(x){return x.d!=null&&x.prev>=0.3&&x.d<0}).sort(function(a,b){return (a.d-b.d)||(a.t.b-b.t.b)});
  base=base.slice(0,40);
  var h=segHtml('fSeg',[['B','Nejvíc bodů'],['U','Největší zlepšení'],['D','Největší propad']],V);
  h+='<div class="sctl"><label for="fN">Posledních</label>'+sel('fN',[3,5,8,10,15],N,function(v){return v+' zápasů'})+oldBox(old)+'</div>';
  if(!base.length)h+='<p class="muted">Pro tento výběr nic.</p>';
  else{
    h+='<div class="tblwrap"><table class="ser"><thead><tr><th class="l">#</th><th class="l">Hráč</th><th class="l hide-m">Klub</th>'
      +'<th class="gab" style="color:var(--blue)">G</th><th class="gab" style="color:var(--y)">A</th><th class="gab">B</th><th>B/z teď</th><th class="hide-m">B/z dřív</th><th>Změna</th></tr></thead><tbody>';
    base.forEach(function(x,i){var t=x.t;
      h+='<tr><td class="l muted">'+(i+1)+'</td><td class="l"><b>'+plink(x.n)+'</b><span class="kmob muted"> '+(KLUB[x.n]||'')+'</span></td><td class="l hide-m">'+klubCell(x.n)+'</td>'
        +'<td class="gab g'+(t.g?'':' zero')+'">'+t.g+'</td><td class="gab a'+(t.a?'':' zero')+'">'+t.a+'</td><td class="gab pts">'+t.b+'</td>'
        +'<td>'+x.rec.toFixed(2)+'</td><td class="hide-m muted">'+(x.prev==null?'–':x.prev.toFixed(2))+'</td><td>'+(x.d==null?'<span class="muted">–</span>':signed(x.d))+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='<p class="small muted">Posledních '+N+' zápasů hráče v aktuální sezóně ('+seasonLabel(CUR)+') proti jeho průměru b/zápas ve všech zápasech před tím (potřeba aspoň '+N+' dřívějších zápasů). '
    +(V==='D'?'Propad: jen hráči s dřívějším průměrem aspoň 0,30 b/z. ':'')+'Zobrazeno nejvýš 40 hráčů. '+diffNote(last)+'</p>';
  return {h:h,bind:function(){
    segBind('fSeg',function(v){SS.fV=v});
    $('fN').onchange=function(){SS.fN=+$('fN').value;renderS()};
    if($('sOld'))$('sOld').onchange=function(){SS.old=$('sOld').checked;renderS()};
  }};
}

function toolOpp(){
  var AA=A(),mz=SS.oMin,up=SS.oDir==='up',c=$('comp').value,s=$('season').value,out=[];
  Object.keys(AA).forEach(function(n){
    var rows=INFR(n).filter(function(r){return (!s||String(r.season)===s)&&(!c||r.comp===c)&&opp(r)});
    if(rows.length<mz+15)return;
    var tot=agg(rows),by={};
    rows.forEach(function(r){(by[opp(r)]=by[opp(r)]||[]).push(r)});
    Object.keys(by).forEach(function(o){
      var rs=by[o];if(rs.length<mz)return;
      var t=agg(rs),rz=tot.z-t.z;if(rz<15)return;
      var rb=(tot.b-t.b)/rz,exp=rb*t.z;
      out.push({n:n,o:o,t:t,rb:rb,exp:exp,d:t.b-exp});
    });
  });
  out.sort(function(a,b){return up?(b.d-a.d):(a.d-b.d)});
  var cnt={},rows2=[];
  out.forEach(function(x){cnt[x.n]=(cnt[x.n]||0)+1;if(cnt[x.n]<=2&&rows2.length<40)rows2.push(x)});
  var h=segHtml('oSeg',[['up','Nad očekávání'],['down','Pod očekávání']],SS.oDir);
  h+='<div class="sctl"><label for="oMin">Proti soupeři aspoň</label>'+sel('oMin',[3,5,8,10,15],mz,function(v){return v+' zápasů'})+'</div>';
  if(!rows2.length)h+='<p class="muted">Pro tento výběr není dost zápasů.</p>';
  else{
    h+='<div class="tblwrap"><table class="ser"><thead><tr><th class="l">#</th><th class="l">Hráč</th><th class="l hide-m">Klub</th><th class="l">Soupeř</th><th class="hide-m">Z</th>'
      +'<th class="gab" style="color:var(--blue)">G</th><th class="gab" style="color:var(--y)">A</th><th class="gab">B</th><th>B/z proti</th><th class="hide-m">B/z jinak</th><th>Rozdíl B</th></tr></thead><tbody>';
    rows2.forEach(function(x,i){var t=x.t;
      h+='<tr><td class="l muted">'+(i+1)+'</td><td class="l"><b>'+plink(x.n)+'</b><span class="kmob muted"> '+(KLUB[x.n]||'')+'</span></td><td class="l hide-m">'+klubCell(x.n)+'</td><td class="l">'+tdot(x.o)+'<b>'+x.o+'</b></td><td class="hide-m">'+t.z+'</td>'
        +'<td class="gab g'+(t.g?'':' zero')+'">'+t.g+'</td><td class="gab a'+(t.a?'':' zero')+'">'+t.a+'</td><td class="gab pts">'+t.b+'</td>'
        +'<td>'+(t.b/t.z).toFixed(2)+'</td><td class="hide-m muted">'+x.rb.toFixed(2)+'</td><td><b>'+signed(x.d,1)+'</b></td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='<p class="small muted">Rozdíl B = skutečné body proti soupeři minus očekávané: průměr b/zápas hráče ve všech ostatních zápasech × počet zápasů proti tomuto soupeři. Počítají se jen hráči s aspoň 15 zápasy proti ostatním týmům; každý hráč nejvýš dvakrát. Platí filtr sezóny a soutěže.'+($('klub').value?' Teď jen '+clubName(Object.keys(A())[0]||'')+' – pro celou ligu vyber nahoře „Celá liga“.':'')+'</p>';
  return {h:h,bind:function(){
    segBind('oSeg',function(v){SS.oDir=v});
    $('oMin').onchange=function(){SS.oMin=+$('oMin').value;renderS()};
  }};
}

function toolMil(){
  var AA=A(),K=SS.mK,left=SS.mLeft,big=SS.mBig,out=[],last='';
  Object.keys(AA).forEach(function(n){
    var rs=sortedCur(n,$('comp').value);if(!rs.length)return;
    var lr=rs[rs.length-1];if(lr.dt>last)last=lr.dt;
    if(daysBetween(lr.dt,'9999-12-31')<0)return;
    var m=milCalc(n),cur=m.tot[K],tg=milNext(K,big?Math.max(cur,99):cur);
    out.push({n:n,k:K,cur:cur,t:tg,left:tg-cur,last:lr});
  });
  var live=out.filter(function(x){return daysBetween(x.last.dt,last)<=10});
  var rows=live.filter(function(x){return x.left<=left}).sort(function(a,b){return (a.left-b.left)||(b.cur-a.cur)||(a.n<b.n?-1:1)}).slice(0,60);
  var T=MTYPE[K];
  var h=segHtml('mSeg',[['b','Body'],['g','Góly'],['z','Zápasy']],K);
  h+='<div class="sctl"><label for="mLeft">Zbývá nejvýš</label>'+sel('mLeft',[5,10,15,25,50],left,function(v){return v})+'<label class="chk"><input type="checkbox" id="mBig"'+(big?' checked':'')+'> jen od 100 (bez 1., 25., 50.)</label></div>';
  if(!rows.length)h+='<p class="muted">Nikdo se v tomto rozsahu k milníku neblíží.</p>';
  else{

  var best=full.slice().sort(function(a,b){return (b.t.b/b.t.z-a.t.b/a.t.z)||(b.t.b-a.t.b)})[0];

function savePngSvg(svg,fname){
  var fe=document.getElementById('fonts');if(fe)svg=svg.replace(/(<svg[^>]*>)/,'$1<style>'+fe.textContent+'</style>');
  var img=new Image(),vb=svg.match(/viewBox="0 0 (\d+) (\d+)"/),W=+vb[1]*2,H=+vb[2]*2;
  img.onload=function(){
    var cv=document.createElement('canvas');cv.width=W;cv.height=H;var ctx=cv.getContext('2d');
    ctx.drawImage(img,0,0,W,H);
    var done=function(blob){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname+'.png';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)};
    try{cv.toBlob(function(b){if(b)done(b)},'image/png')}catch(e){alert('Export obrázku se nepodařil.')}

}

  return true}
function addPlayer(kod,name,rows,id){
  var key=name,nk=normTok(name),k0=null;
  // stejný hráč podle id (i s jiným pořadím jména), jinak podle jména, pokud do sebe zápasy sedí (přestup, hráč z dat Motoru bez id)
  if(id&&IDK[id]&&EMB[IDK[id]])k0=IDK[id];
  else{var c=EMB[key]?key:NK[nk];if(c&&EMB[c]&&!(id&&IDS[c]&&IDS[c]!==id)&&compat(EMB[c],rows))k0=c}
  if(k0){ // přestup: sloučit zápasy, klub podle posledního zápasu
    var d1=lastDt(EMB[k0]),d2=lastDt(rows);EMB[k0]=mergeRows(EMB[k0],rows);if(d2>d1)KLUB[k0]=kod;
    if(id&&!IDS[k0]){IDS[k0]=id;IDK[id]=k0}
    return}
  if(EMB[key])key=name+' ('+kod+')';
  EMB[key]=rows;KLUB[key]=kod;IDS[key]=id||null;if(id){LASTFMT[key]=true;IDK[id]=key}
  if(!NK[nk])NK[nk]=key;
}
var LOADED={};
function addGoalie(kod,name,rows,id){
  var key=name;
  if(EMBG[key]){
    if(id&&IDS['G:'+key]===id){var d1=lastDt(EMBG[key]),d2=lastDt(rows);EMBG[key]=mergeRows(EMBG[key],rows);if(d2>d1)KLUBG[key]=kod;return}
    key=name+' ('+kod+')'}
  EMBG[key]=rows;KLUBG[key]=kod;IDS['G:'+key]=id||null;LASTFMT[key]=true;
}
function getJson(url){return fetch(url,{cache:'no-cache'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})}
function ensure(kod){
  if(LOADED[kod])return LOADED[kod];
  LOADED[kod]=Promise.all([getJson('liga/'+kod+'.json'),kod==='CEB'?getJson('bilance_data.json'):Promise.resolve(null)]).then(function(res){
    var L=res[0],M=res[1];
    if(!L&&!M)throw new Error('liga/'+kod+'.json nenalezen');
    if(M&&M.hraci){Object.keys(M.hraci).forEach(function(n){addPlayer(kod,n,M.hraci[n],null)})}
    else if(L){Object.keys(L.hraci||{}).forEach(function(n){addPlayer(kod,n,L.hraci[n].map(expand),(L.idy||{})[n])})}
    if(L){Object.keys(L.brankari||{}).forEach(function(n){addGoalie(kod,n,L.brankari[n].map(expand),(L.idy||{})[n])})}
    var st=(L&&L.vygenerovano)||(M&&M.vygenerovano);if(st)STAMP[kod]=st;
  });
  return LOADED[kod];
}
var STAMP={};
function note(t){$('loadnote').textContent=t||''}
function loadClub(k){
  var list=k?[k]:CLUBS.map(function(c){return c.kod}),done=0,tot=list.length;
  var todo=list.filter(function(c){return !LOADED[c]});
  if(todo.length)note('Načítám data… 0/'+todo.length);
  return Promise.all(list.map(function(c){var had=!!LOADED[c];return ensure(c).then(function(){if(!had){done++;note('Načítám data… '+done+'/'+todo.length)}})})).then(function(){
    note('');var st=Object.keys(STAMP).map(function(c){return STAMP[c]}).sort().pop();
    if(st){var t=new Date(st);$('updated').textContent='Extraliga vč. play off · data z hokej.cz · aktualizováno '+t.getDate()+'. '+(t.getMonth()+1)+'. '+t.getFullYear()}
    return RUCP.then(applyFix);
  });
}
function clubSelect(){
  var sel=$('klub'),cur=sel.value;
  sel.innerHTML='<option value="">Celá liga (načte všechny kluby)</option>'+CLUBS.map(function(c){return '<option value="'+c.kod+'">'+c.nazev+'</option>'}).join('');
  sel.value=cur;
}
var RUC={},RUCP=getJson('liga/rucne.json').then(function(r){RUC=r||{}});
function applyFix(){
  [EMB,EMBG].forEach(function(M){Object.keys(M).forEach(function(n){M[n].forEach(function(r){var f=RUC[n+'|'+r.dt];if(f)r.fix=f})})});
  INF={};INFGC={};
}
$('klub').onchange=function(){
  var k=$('klub').value;try{localStorage.setItem('bilanceLigaKlub',k)}catch(e){}
  loadClub(k).then(function(){$('player').value='';refresh()}).catch(function(e){note('Nepodařilo se načíst data: '+e.message)});
};
(function(){
  fetch('liga/index.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():[]}).catch(function(){return []}).then(function(idx){
    CLUBS=idx.map(function(c){return {kod:c.kod,nazev:TEAMS[c.kod]||c.nazev}});
    idx.forEach(function(c){if(c.kod==='CEB')return;(c.jm||[]).forEach(function(n){IDXN.push({n:n,club:c.kod,g:false})});(c.br||[]).forEach(function(n){IDXN.push({n:n,club:c.kod,g:true})})});
    return fetch('bilance_data.json',{method:'HEAD'}).then(function(r){
      if(r.ok&&!CLUBS.some(function(c){return c.kod==='CEB'}))CLUBS.push({kod:'CEB',nazev:TEAMS.CEB});
    }).catch(function(){}).then(function(){
      CLUBS.sort(function(a,b){return a.nazev<b.nazev?-1:a.nazev>b.nazev?1:0});
      if(!CLUBS.length){note('Zatím nejsou nahraná žádná data extraligy (scripts/liga_raw → workflow Import extraligy).');return}
      var k='';try{k=localStorage.getItem('bilanceLigaKlub')||''}catch(e){}
      var m=(location.hash||'').match(/klub=([A-Z]+)/);if(m)k=m[1];
      if(!k||!CLUBS.some(function(c){return c.kod===k}))k=CLUBS[0].kod;
      clubSelect();$('klub').value=k;
      return loadClub(k).then(function(){refresh();fromHash()});
    });
  }).catch(function(e){note('Chyba načítání: '+(e&&e.message||e));console.error(e)});
})();
})();
</script>

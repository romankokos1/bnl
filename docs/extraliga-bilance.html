  /* Vzhled: tisková výsledková příloha. Papír, černá a červená jako druhá barva, tabulky bez rámečků. */
  :root {
    --ink: #141414; --red: #e2231a; --navy: #141414; --bg: #ecebe6; --card: #ecebe6;
    --muted: #5a5a55; --border: #bdbbb1; --green: #141414; --warn: #b3261e;
    --hm0: #dcdad0; --ontip: #141414; --pillon: #141414; --field: #e3e1d8;
    --f-head: "Archivo Black", "Arial Black", Impact, sans-serif;
    --f-body: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --ink: #ece9e1; --red: #ff5648; --navy: #ece9e1; --bg: #151513; --card: #151513;
    --muted: #a09e95; --border: #3b3b36; --green: #ece9e1; --warn: #ffb4a8;
    --hm0: #242422; --ontip: #3b3b36; --pillon: #ece9e1; --field: #1d1d1a;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ece9e1; --red: #ff5648; --navy: #ece9e1; --bg: #151513; --card: #151513;
      --muted: #a09e95; --border: #3b3b36; --green: #ece9e1; --warn: #ffb4a8;
      --hm0: #242422; --ontip: #3b3b36; --pillon: #ece9e1; --field: #1d1d1a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { font: 400 17px/1.3 var(--f-body); background: var(--bg); color: var(--ink); margin: 0; padding: 22px 18px; -webkit-tap-highlight-color: transparent; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font: 400 clamp(2.2rem, 6vw, 3.7rem)/0.92 var(--f-head); letter-spacing: -.035em; margin: 0; padding-top: 10px; border-top: 9px solid var(--ink); }
  .updated { display: flow-root; color: var(--muted); font-size: .95rem; margin: 10px 0 26px; padding-bottom: 8px; border-bottom: 3px solid var(--red); }
  .updated a { color: var(--ink); text-underline-offset: 3px; }
  .theme-btn { float: right; border: 2px solid var(--ink); background: transparent; color: var(--ink); width: 34px; height: 34px; font-size: 1rem; cursor: pointer; line-height: 1; margin-top: 8px; }
  .card { border-top: 3px solid var(--ink); padding: 8px 0 0; margin-bottom: 30px; }
  .card h2 { font: 400 1.45rem/1.1 var(--f-head); letter-spacing: -.02em; margin: 0 0 12px; }
  .muted { color: var(--muted); } .small { font-size: .85rem; }
  .pos { color: var(--ink); font-weight: 700; } .neg { color: var(--red); font-weight: 700; } .warn { color: var(--warn); }
  .tdot { display: inline-block; width: 9px; height: 9px; margin-right: 7px; background: var(--tc, var(--muted)); }

  /* záložky */
  .seg { display: flex; border: 2px solid var(--ink); margin-bottom: 16px; }
  .seg button { flex: 1; border: 0; border-right: 2px solid var(--ink); background: transparent; color: var(--ink); font: 700 1rem var(--f-body); padding: 8px 6px; cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--ink); color: var(--bg); }

  /* výběry */
  .search { position: relative; margin-bottom: 14px; }
  .filters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .f-main, .f-club { grid-column: 1 / -1; }
  .seg.sub { margin-bottom: 10px; }
  .gsel { margin-bottom: 12px; }
  #gcard .tiles { grid-template-columns: repeat(5, 1fr); }
  @media (max-width: 640px) { #gcard .tiles { grid-template-columns: repeat(3, 1fr); } }
  .filters label { display: block; font-size: .82rem; font-weight: 700; color: var(--muted); margin-bottom: 1px; }
  select, input[type=text], input[type=search], textarea { width: 100%; font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 2px solid var(--ink); border-radius: 0; padding: 6px 2px; }
  select:focus, input:focus, textarea:focus { outline: 2px solid var(--red); outline-offset: 2px; }
  .search input { font-size: 1.1rem; background: var(--field); padding: 10px 12px; border-bottom-width: 3px; }
  .hres { position: absolute; left: 0; right: 0; top: 100%; z-index: 30; background: var(--bg); border: 2px solid var(--ink); }
  .hres button { display: flex; width: 100%; justify-content: space-between; align-items: baseline; gap: 10px; text-align: left; border: 0; border-bottom: 1px solid var(--border); background: none; color: var(--ink); font: 700 1rem var(--f-body); padding: 9px 12px; cursor: pointer; }
  .hres button:last-child { border-bottom: 0; }
  .hres button:hover, .hres button.hi { background: var(--ink); color: var(--bg); }
  .hres button span { font-weight: 400; font-size: .85rem; opacity: .75; }
  .hres .none { padding: 10px 12px; color: var(--muted); font-size: .9rem; }
  .solo .search { display: none; }
  .pickmode { display: flex; gap: 16px; margin: 14px 0 8px; }
  .pickmode button { border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); font: 700 .95rem var(--f-body); padding: 2px 0; cursor: pointer; }
  .pickmode button.on { color: var(--ink); border-bottom-color: var(--red); }

  /* soupiska jako mřížka */
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); margin-bottom: 4px; }
  .chip { border: 0; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); background: transparent; color: var(--ink); font: inherit; padding: 5px 9px; cursor: pointer; text-align: left; line-height: 1.15; min-width: 0; box-shadow: inset 4px 0 var(--tc, transparent); }
  .chip:hover { background: var(--field); }
  .chip b { display: block; font: 700 1rem var(--f-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .no { display: block; font-size: .78rem; color: var(--red); font-weight: 700; }
  .chip.on { background: var(--ink); color: var(--bg); }
  .chip.on .no { color: var(--bg); opacity: .8; }

  /* hlavička hráče: příjmení jako titulek, pod ním číselná lišta */
  .tiles { margin: 20px 0 10px; border-top: 5px solid var(--ink); }
  .sbn { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; padding: 8px 0 6px; }
  .sbn i { order: 3; font: 700 1.25rem var(--f-body); color: var(--red); font-style: normal; }
  .sbn b { font: 400 clamp(2.6rem, 7vw, 4.4rem)/0.95 var(--f-head); letter-spacing: -.04em; overflow-wrap: anywhere; }
  .sbn span { font-size: 1.15rem; color: var(--muted); }
  .sbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--border); }
  .tile { padding: 8px 10px 6px 12px; border-left: 1px solid var(--border); }
  .sbs .tile:first-child { padding-left: 0; border-left: 0; }
  .tile b { display: block; font: 400 2.5rem/1.05 var(--f-head); letter-spacing: -.04em; }

<script>
(function(){
if(window.BILANCE_EMBED||/(^|[#&])solo=1/.test(location.hash))document.documentElement.className+=' solo';
var KEY='bilanceProtiTymum.v1', db={};
try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){db={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var prow=[],prowAll=[],CUR=0,CISLA={},pick='tiles',mode='P',EMB={},KONTR={},META={},sortKey=null,sortDir=-1;
var KLUB={},IDS={},INF={},CLUBS=[];
function A(){var o={},k=$('klub')?$('klub').value:'',n;for(n in EMB)if(!k||KLUB[n]===k)o[n]=EMB[n];return o}
function clubName(n){var k=KLUB[n];return TEAMS[k]||k||''}
function INFR(n){var r=INF[n];if(!r){r=EMB[n].map(function(x){return Object.assign({},x)});inferTeams(r,KLUB[n]);INF[n]=r}return r}

var TEAMS={CEB:'České Budějovice',KLA:'Kladno',VIT:'Vítkovice',LIB:'Liberec',PLZ:'Plzeň',KOM:'Kometa Brno',SPA:'Sparta',PCE:'Pardubice',LIT:'Litvínov',KVA:'Karlovy Vary',OLO:'Olomouc',MHK:'Hradec Králové',MBL:'Mladá Boleslav',TRI:'Třinec',ZLN:'Zlín',CHM:'Chomutov',JIH:'Jihlava',ZNO:'Znojmo'};
var TEAMCOL={CEB:'#c8102e',KLA:'#1d4ea1',VIT:'#2563b8',LIB:'#1e7fc4',PLZ:'#1b5fa8',KOM:'#b3261e',SPA:'#9b1b30',PCE:'#d92b2b',LIT:'#e0262c',KVA:'#c0392b',OLO:'#2b6cb0',MHK:'#e8590c',MBL:'#d4a017',TRI:'#c8102e',ZLN:'#e11d48',CHM:'#d1242a',JIH:'#e6a700',ZNO:'#6b7280'};
function tdot(c){return '<i class="tdot" style="--tc:'+(TEAMCOL[c]||'#94a3b8')+'"></i>'}
function teamCell(c){return tdot(c)+'<b>'+c+'</b>'+(TEAMS[c]?'<span class="full">'+TEAMS[c]+'</span>':'')}
function teamName(c){return TEAMS[c]?c+' – '+TEAMS[c]:c}

function seasonOf(d){return d.m>=7?d.y:d.y-1}
function parseRows(txt){
  var out=[],bad=0;
  txt.split(/\r?\n/).forEach(function(line){
    var c=line.split('\t'); if(c.length<9)c=line.trim().split(/\s{2,}/);
    var m=(c[0]||'').trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    if(!m){if(line.trim()&&!/datum/i.test(line))bad++;return}
    var teams=(c[3]||'').split(/\s*[–—-]\s*/);
    if(teams.length!==2){bad++;return}
    var sk=(c[4]||'').trim().match(/(\d+)\s*:\s*(\d+)/);
    var n=function(i){var v=parseInt(String(c[i]||'0').replace('−','-'),10);return isNaN(v)?0:v};
    var toi=(c[10]||'').trim().match(/(\d+):(\d+)/);
    var d={y:+m[3],m:+m[2],d:+m[1]};
    out.push({dt:m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2),season:seasonOf(d),
      kolo:(c[1]||'').trim(),comp:(c[2]||'').trim(),a:teams[0].trim(),b:teams[1].trim(),
      sa:sk?+sk[1]:null,sb:sk?+sk[2]:null,ot:/\s(P|N|SN)\s*$/.test(c[4]||''),
      g:n(5),as:n(6),p:n(7),pm:n(8),tm:n(9),toi:toi?+toi[1]*60+ +toi[2]:0});
  });
  return {rows:out,bad:bad};
}

// odvodí tým hráče: běh po sobě jdoucích zápasů sdílí společný tým
function inferTeams(rows,home){
  var bySeason={};
  rows.forEach(function(r){r.team=null;r.amb=false;(bySeason[r.season]=bySeason[r.season]||[]).push(r)});
  Object.keys(bySeason).forEach(function(k){
    var g=bySeason[k].sort(function(x,y){return x.dt<y.dt?-1:1}),run=[],cand=null;
    function flush(){
      if(!run.length)return;
      var t=cand&&cand.length===1?cand[0]:null;
      run.forEach(function(r){r.team=t;r.amb=!t});
      run=[];cand=null;
    }
    g.forEach(function(r){
      var s=[r.a,r.b];
      if(cand===null){cand=s;run=[r];return}
      var inter=cand.filter(function(x){return s.indexOf(x)>-1});
      if(inter.length){cand=inter;run.push(r)}else{flush();cand=s;run=[r]}
    });
    flush();
  });
  // ruční určení týmu (bilance_rucne.json) a pravidlo: nejednoznačný zápas
  // aktuální sezóny proti CEB hrál hráč Motoru za Motor
  rows.forEach(function(r){
    if(r.fix&&(r.fix===r.a||r.fix===r.b)){r.team=r.fix;r.amb=false}
    else if(r.amb&&home&&r.season===CUR&&(r.a===home||r.b===home)){r.team=home;r.amb=false}
  });
  rows.forEach(function(r){r.mine=!!home&&r.team===home});
  // zbylé nejasné zápasy: tým z nejbližšího jasného zápasu (dřív, jinak později), pokud v tom zápase hrál
  var srt=rows.slice().sort(function(x,y){return x.dt<y.dt?-1:x.dt>y.dt?1:0});
  srt.forEach(function(r,i){
    if(r.team||!r.amb)return;
    var j,t=null;
    for(j=i-1;j>=0;j--)if(srt[j].team){t=srt[j].team;break}
    if(t!==r.a&&t!==r.b){t=null;for(j=i+1;j<srt.length;j++)if(srt[j].team){t=srt[j].team;break}}
    if(t===r.a||t===r.b){r.team=t;r.amb=false;r.odhad=true}
  });
}
function opp(r){return r.team?(r.team===r.a?r.b:r.a):null}
function won(r){ if(r.sa==null||!r.team)return null; var mine=r.team===r.a?r.sa:r.sb,th=r.team===r.a?r.sb:r.sa; return mine>th}

$('add').onclick=function(){
  var nm=$('name').value.trim(); if(!nm){$('msg').textContent='Doplň jméno hráče.';return}
  var p=parseRows($('paste').value); if(!p.rows.length){$('msg').textContent='Nenašel jsem žádné řádky zápasů (očekávám tabulátory a datum jako 18.10.2026).';return}
  var cur=db[nm]=db[nm]||[],have={},added=0;
  cur.forEach(function(r){have[r.dt+r.a+r.b]=1});
  p.rows.forEach(function(r){var k=r.dt+r.a+r.b;if(!have[k]){have[k]=1;cur.push(r);added++}});
  save();$('paste').value='';
  $('msg').textContent='Přidáno '+added+' zápasů ('+(p.rows.length-added)+' duplicit přeskočeno'+(p.bad?', '+p.bad+' řádků nerozpoznáno':'')+').';
  refresh(nm);
};

function seasonLabel(s){return s+'/'+String(+s+1).slice(2)}
function refresh(sel){
  var AA=A(),names=Object.keys(AA).sort(byName),keep=sel||$('player').value;
  fill($('player'),names,keep);
  var seasons={},comps={};
  names.forEach(function(n){AA[n].forEach(function(r){seasons[r.season]=1;comps[r.comp]=1})});
  CUR=0;for(var cs in seasons)CUR=Math.max(CUR,+cs);INF={};INFGC={};
  var keepS=$('season').value;
  var sv=Object.keys(seasons).map(Number).sort(function(a,b){return b-a}).map(String);
  $('season').innerHTML='<option value="">Všechny sezóny</option>'+sv.map(function(v){return '<option value="'+v+'">'+seasonLabel(v)+'</option>'}).join('');
  if(keepS===''||sv.indexOf(keepS)>-1)$('season').value=keepS;
  fill($('comp'),Object.keys(comps).sort(),$('comp').value,'Všechny soutěže');
  var teams={};names.forEach(function(n){INFR(n).forEach(function(x){var o=opp(x);if(o)teams[o]=1})});

function whereOk(r){var k=$('kde').value;if(!k)return true;if(!r.team)return false;var home=r.team===r.a;return k==='D'?home:!home}
function clubOk(r){var k=$('club').value;return !k||(k==='H'?r.mine:!r.mine)}
function filt(n,noWhere){
  var rows=INFR(n);
  var s=$('season').value,c=$('comp').value;
  return rows.filter(function(r){return (!s||String(r.season)===s)&&(!c||r.comp===c)&&clubOk(r)&&(noWhere||whereOk(r))});
}
function agg(rows){
  var t={z:0,g:0,a:0,b:0,pm:0,tm:0,toi:0,toiz:0,w:0,l:0};
  rows.forEach(function(r){t.z++;t.g+=r.g;t.a+=r.as;t.b+=r.p;t.pm+=r.pm;t.tm+=r.tm;if(r.toi){t.toi+=r.toi;t.toiz++}var w=won(r);if(w===true)t.w++;else if(w===false)t.l++});
  return t;
}
function fmtPm(v){return '<span class="'+(v>0?'pos':v<0?'neg':'')+'">'+(v>0?'+'+v:v)+'</span>'}
function fmtToi(t){if(!t.toiz)return '–';var a=Math.round(t.toi/t.toiz);return Math.floor(a/60)+':'+('0'+a%60).slice(-2)}
function hb(v,max){if(!max||v<=0)return '';return '<i class="hb" style="width:'+Math.max(6,Math.round(100*v/max))+'%"></i>'}
function formHtml(rows){

}

function dlabel(iso){
  if(!iso)return '';var m=iso.match(/^(\d{4})-(\d\d)-(\d\d)$/);if(!m)return iso;
  var d=new Date(+m[1],+m[2]-1,+m[3]),dny=['Ne','Po','Út','St','Čt','Pá','So'];
  return dny[d.getDay()]+' '+(+m[3])+'. '+(+m[2])+'.';
}

/* ====== milníky ====== */
function allRowsFor(n){return INFR(n)}
var MTYPE={z:{ic:'Z',one:'zápas',lbl:'zápas'},g:{ic:'G',one:'gól',lbl:'gól'},b:{ic:'B',one:'bod',lbl:'bod'}};
function milGrid(k,max){var out=[],v;
  if(k==='z'){for(v=100;v<=max;v+=100)out.push(v)}
  else if(k==='g'){[1,25,50].forEach(function(x){if(x<=max)out.push(x)});for(v=100;v<=max;v+=50)out.push(v)}
  else{[1,50].forEach(function(x){if(x<=max)out.push(x)});for(v=100;v<=max;v+=100)out.push(v)}
  return out}
function milNext(k,cur){var v=cur+1;
  if(k==='z')return Math.ceil(v/100)*100;
  if(k==='g'){if(v<=1)return 1;if(v<=25)return 25;if(v<=50)return 50;return Math.ceil(v/50)*50}
  if(v<=1)return 1;if(v<=50)return 50;if(v<=100)return 100;return Math.ceil(v/100)*100}
function milCalc(n){
  var comp=$('comp').value,rows=allRowsFor(n).filter(function(r){return !comp||r.comp===comp});
  rows.sort(function(x,y){return x.dt<y.dt?-1:x.dt>y.dt?1:0});
  var cum={z:0,g:0,b:0},T={z:[],g:[],b:[]},items=[],i,k,pos={z:0,g:0,b:0};
  var tot={z:rows.length,g:0,b:0};rows.forEach(function(r){tot.g+=r.g;tot.b+=r.p});
  ['z','g','b'].forEach(function(kk){T[kk]=milGrid(kk,tot[kk])});
  rows.forEach(function(r){
    var add={z:1,g:r.g,b:r.p};
    ['z','g','b'].forEach(function(kk){
      cum[kk]+=add[kk];
      while(pos[kk]<T[kk].length&&cum[kk]>=T[kk][pos[kk]]){items.push({k:kk,n:T[kk][pos[kk]],r:r,add:add[kk],cum:cum[kk]});pos[kk]++}
    });
  });
  var next={};['z','g','b'].forEach(function(kk){var t=milNext(kk,tot[kk]);next[kk]={t:t,left:t-tot[kk]}});
  return {items:items,tot:tot,next:next};
}
function fdate(d){var m=d.match(/^(\d{4})-(\d\d)-(\d\d)/);return m?(+m[3])+'. '+(+m[2])+'. '+m[1]:d}
function milWhere(r){
  var o=r.team?opp(r):null,sc=(r.sa!=null?(r.team===r.b?r.sb+':'+r.sa:r.sa+':'+r.sb):'');
  if(!o)return r.a+' – '+r.b+(r.sa!=null?' '+r.sa+':'+r.sb:'');
  return 'proti '+(TEAMS[o]||o)+' ('+(r.team===r.a?'doma':'venku')+(sc?', '+sc:'')+')';
}
function milLabel(it){var t=MTYPE[it.k];return it.n+'. '+t.lbl}
function milHtml(n){
  var M=milCalc(n),comp=$('comp').value;
  var h='<h2>Milníky — '+xe(n)+'</h2>';
  h+='<div class="mil-next">'+['z','g','b'].map(function(k){var x=M.next[k],t=MTYPE[k];
    return '<div><span>Další '+t.one+'</span><b>'+x.t+'.</b><i>'+(x.left<=0?'splněno':'ještě '+x.left+' '+(k==='z'?'zápasů':k==='g'?'gólů':'bodů'))+' · teď '+M.tot[k]+'</i></div>'}).join('')+'</div>';
  if(!M.items.length)h+='<p class="muted small">Zatím žádný milník (počítá se od 1. gólu a 1. bodu, pak 25./50./100. gól, 50./100. bod a každý 100. zápas).</p>';
  else h+='<ul class="mil">'+M.items.slice().sort(function(a,b){return a.r.dt<b.r.dt?1:a.r.dt>b.r.dt?-1:0}).map(function(it){
    var extra=it.k!=='z'&&it.add>1?' <span class="muted">(v zápase +'+it.add+')</span>':'';
    return '<li><span class="ic">'+MTYPE[it.k].ic+'</span><span class="t">'+milLabel(it)+extra+'</span><span class="w">'+fdate(it.r.dt)+' · '+xe(milWhere(it.r))+'</span></li>'}).join('')+'</ul>';
  h+='<p class="small muted">Počítá se '+(comp?xe(comp):'extraliga včetně play off')+', od začátku dostupných dat (data z hokej.cz).</p>';
  return h;
}

  if(poly){
    var tgt=poly.getAttribute('data-pts').split(' ').map(function(p){return p.split(',').map(Number)}),cx=300,cy=458,t0=null;
    var dp=Array.prototype.map.call(dots,function(d){return [d,+d.getAttribute('cx'),+d.getAttribute('cy')]});
    dp.forEach(function(x){x[0].setAttribute('cx',cx);x[0].setAttribute('cy',cy)});
    (function f(ts){if(t0===null)t0=ts;var k=ease(Math.min(1,(ts-t0)/900));
      poly.setAttribute('points',tgt.map(function(p){return (cx+(p[0]-cx)*k).toFixed(1)+','+(cy+(p[1]-cy)*k).toFixed(1)}).join(' '));
      dp.forEach(function(x){x[0].setAttribute('cx',(cx+(x[1]-cx)*k).toFixed(1));x[0].setAttribute('cy',(cy+(x[2]-cy)*k).toFixed(1))});
      if(ts-t0<900)requestAnimationFrame(f)})(performance.now?performance.now():0);
  }
}
function savePng(n,rows,all){savePngSvg(cardSvg(n,rows,true,all),'bilance-'+ascii(n))}
function savePngSvg(svg,fname){
  var img=new Image(),vb=svg.match(/viewBox="0 0 (\d+) (\d+)"/),W=+vb[1]*2,H=+vb[2]*2;
  img.onload=function(){
    var cv=document.createElement('canvas');cv.width=W;cv.height=H;var ctx=cv.getContext('2d');
    ctx.drawImage(img,0,0,W,H);
    var done=function(blob){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname+'.png';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)};
    try{cv.toBlob(function(b){if(b)done(b)},'image/png')}catch(e){alert('Export obrázku se nepodařil.')}
  };
  img.onerror=function(){alert('Export obrázku se nepodařil.')};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

function sdilej(btn,solo){
  var n=$('player').value;if(!n)return;
  var base=location.href.split('#')[0],rel=META.odkazy&&META.odkazy[n];
  var url=solo&&rel?new URL(rel,base).href:base+'#hrac='+encodeURIComponent(n)+(solo?'&solo=1':'');
  function ok(){var t=btn.textContent;btn.textContent='✓ Zkopírováno';setTimeout(function(){btn.textContent=t},1800)}
  if(navigator.share&&/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)){navigator.share({title:n+' — bilance proti týmům',url:url}).catch(function(){});return}
  try{navigator.clipboard.writeText(url).then(ok,function(){prompt('Zkopíruj odkaz:',url)})}catch(e){prompt('Zkopíruj odkaz:',url)}
}
$('linkBtn').onclick=function(){sdilej($('linkBtn'),false)};
$('linkSolo').onclick=function(){sdilej($('linkSolo'),true)};
function fromHash(){
  var m=(location.hash||'').match(/hrac=([^&]+)/);if(!m)return;
  var n;try{n=decodeURIComponent(m[1])}catch(e){return}
  if(A()[n]){openPlayer(n);if(/(^|[#&])solo=1/.test(location.hash)){document.title=n+' — bilance proti týmům';try{window.scrollTo(0,0)}catch(e){}}}
}
function applyData(d){
  EMB=d.hraci||{};KONTR=d.kontrola||{};CISLA=d.cisla||{};META={vygenerovano:d.vygenerovano,nenalezeno:d.nenalezeno,korekce:d.korekce,pristi:d.pristi,odkazy:d.odkazy||{}};
  if(d.vygenerovano){var t=new Date(d.vygenerovano);$('updated').textContent='Extraliga vč. play off · data z hokej.cz · aktualizováno '+t.getDate()+'. '+(t.getMonth()+1)+'. '+t.getFullYear()}
  kontrolaHtml();refresh();pristiHtml();rekordyHtml(true);
  if(window.BILANCE_EMBED){var n0=Object.keys(EMB)[0];if(n0){openPlayer(n0);document.title=n0+' — bilance proti týmům';try{window.scrollTo(0,0)}catch(e){}}}
  else fromHash();
}

function expand(a){return {dt:a[0],kolo:a[1],comp:a[2],a:a[3],b:a[4],sa:a[5],sb:a[6],ot:!!a[7],g:a[8],as:a[9],p:a[10],pm:a[11],tm:a[12],toi:a[13],season:a[14]}}
function lastDt(rows){var m='';rows.forEach(function(r){if(r.dt>m)m=r.dt});return m}
function mergeRows(old,add){var seen={};old.forEach(function(r){seen[r.dt+r.a+r.b]=1});var out=old.slice();add.forEach(function(r){if(!seen[r.dt+r.a+r.b])out.push(r)});return out}
function addPlayer(kod,name,rows,id){
  var key=name;
  if(EMB[key]){
    if(id&&IDS[key]===id){ // stejný hráč ve dvou klubech (přestup): sloučit zápasy, klub podle posledního zápasu
      var d1=lastDt(EMB[key]),d2=lastDt(rows);EMB[key]=mergeRows(EMB[key],rows);if(d2>d1)KLUB[key]=kod;return}
    key=name+' ('+kod+')'}
  EMB[key]=rows;KLUB[key]=kod;IDS[key]=id||null;if(id)LASTFMT[key]=true;
}
var LOADED={};
function addGoalie(kod,name,rows,id){
  var key=name;
  if(EMBG[key]){
    if(id&&IDS['G:'+key]===id){var d1=lastDt(EMBG[key]),d2=lastDt(rows);EMBG[key]=mergeRows(EMBG[key],rows);if(d2>d1)KLUBG[key]=kod;return}
    key=name+' ('+kod+')'}
  EMBG[key]=rows;KLUBG[key]=kod;IDS['G:'+key]=id||null;LASTFMT[key]=true;
}
function getJson(url){return fetch(url,{cache:'no-cache'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})}
function ensure(kod){
  if(LOADED[kod])return LOADED[kod];
  LOADED[kod]=Promise.all([getJson('liga/'+kod+'.json'),kod==='CEB'?getJson('bilance_data.json'):Promise.resolve(null)]).then(function(res){
    var L=res[0],M=res[1];
    if(!L&&!M)throw new Error('liga/'+kod+'.json nenalezen');
    if(M&&M.hraci){Object.keys(M.hraci).forEach(function(n){addPlayer(kod,n,M.hraci[n],null)})}
    else if(L){Object.keys(L.hraci||{}).forEach(function(n){addPlayer(kod,n,L.hraci[n].map(expand),(L.idy||{})[n])})}
    if(L){Object.keys(L.brankari||{}).forEach(function(n){addGoalie(kod,n,L.brankari[n].map(expand),(L.idy||{})[n])})}
    var st=(L&&L.vygenerovano)||(M&&M.vygenerovano);if(st)STAMP[kod]=st;
  });
  return LOADED[kod];
}
var STAMP={};
function note(t){$('loadnote').textContent=t||''}
function loadClub(k){
  var list=k?[k]:CLUBS.map(function(c){return c.kod}),done=0,tot=list.length;
  var todo=list.filter(function(c){return !LOADED[c]});
  if(todo.length)note('Načítám data… 0/'+todo.length);
  return Promise.all(list.map(function(c){var had=!!LOADED[c];return ensure(c).then(function(){if(!had){done++;note('Načítám data… '+done+'/'+todo.length)}})})).then(function(){
    note('');var st=Object.keys(STAMP).map(function(c){return STAMP[c]}).sort().pop();
    if(st){var t=new Date(st);$('updated').textContent='Extraliga vč. play off · data z hokej.cz · aktualizováno '+t.getDate()+'. '+(t.getMonth()+1)+'. '+t.getFullYear()}
    return RUCP.then(applyFix);
  });
}
function clubSelect(){
  var sel=$('klub'),cur=sel.value;
  sel.innerHTML='<option value="">Celá liga (načte všechny kluby)</option>'+CLUBS.map(function(c){return '<option value="'+c.kod+'">'+c.nazev+'</option>'}).join('');
  sel.value=cur;
}
var RUC={},RUCP=getJson('liga/rucne.json').then(function(r){RUC=r||{}});
function applyFix(){
  [EMB,EMBG].forEach(function(M){Object.keys(M).forEach(function(n){M[n].forEach(function(r){var f=RUC[n+'|'+r.dt];if(f)r.fix=f})})});
  INF={};INFGC={};
}
$('klub').onchange=function(){
  var k=$('klub').value;try{localStorage.setItem('bilanceLigaKlub',k)}catch(e){}
  loadClub(k).then(function(){$('player').value='';refresh()}).catch(function(e){note('Nepodařilo se načíst data: '+e.message)});
};
(function(){
  fetch('liga/index.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():[]}).catch(function(){return []}).then(function(idx){
    CLUBS=idx.map(function(c){return {kod:c.kod,nazev:TEAMS[c.kod]||c.nazev}});
    idx.forEach(function(c){if(c.kod==='CEB')return;(c.jm||[]).forEach(function(n){IDXN.push({n:n,club:c.kod,g:false})});(c.br||[]).forEach(function(n){IDXN.push({n:n,club:c.kod,g:true})})});
    return fetch('bilance_data.json',{method:'HEAD'}).then(function(r){
      if(r.ok&&!CLUBS.some(function(c){return c.kod==='CEB'}))CLUBS.push({kod:'CEB',nazev:TEAMS.CEB});
    }).catch(function(){}).then(function(){
      CLUBS.sort(function(a,b){return a.nazev<b.nazev?-1:a.nazev>b.nazev?1:0});
      if(!CLUBS.length){note('Zatím nejsou nahraná žádná data extraligy (scripts/liga_raw → workflow Import extraligy).');return}
      var k='';try{k=localStorage.getItem('bilanceLigaKlub')||''}catch(e){}
      var m=(location.hash||'').match(/klub=([A-Z]+)/);if(m)k=m[1];
      if(!k||!CLUBS.some(function(c){return c.kod===k}))k=CLUBS[0].kod;
      clubSelect();$('klub').value=k;
      return loadClub(k).then(function(){refresh();fromHash()});
    });
  }).catch(function(e){note('Chyba načítání: '+(e&&e.message||e));console.error(e)});
})();
})();
</script>

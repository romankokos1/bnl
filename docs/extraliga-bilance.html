  #linkBtn, #linkSolo, #manual, #kontrola, #pristi { display: none !important; }
  #loadnote { margin: 8px 0 0; min-height: 1.1em; }
  table.hm td.hc { animation-delay: calc(min(var(--i), 40) * 18ms); }
  .debut { margin: 0 0 14px; font-size: .95rem; }
  .debut b:first-child { margin-right: 6px; }
  .sctl { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin: 0 0 12px; }
  .sctl label { font-size: .8rem; color: var(--muted); font-weight: 600; }
  .sctl select { width: auto; }
  .sctl .chk { display: flex; gap: 6px; align-items: center; font-weight: 400; }
  table.ser th.l, table.ser td.l { text-align: left; }
  table.ser th::after { content: none !important; }
  table.ser { table-layout: auto; }
  table.ser td.skc { position: relative; min-width: 80px; }
  .seg.tools button { font-size: .95rem; }
  .mic { display: inline-block; width: 1.8em; height: 1.8em; line-height: 1.8em; border-radius: 3px; text-align: center; font: 700 .78rem var(--f-chalk); }
  .mic.ic-g { background: var(--blue); color: #fff; } .mic.ic-b { background: var(--chalk); color: var(--board); } .mic.ic-z { border: 1.5px solid var(--line); color: var(--muted); line-height: 1.55em; }
  .kmob { display: none; font-size: .8rem; }
  @media (max-width: 640px) { .kmob { display: inline; } table.ser th, table.ser td { padding: 6px 4px; } }
  table.ser td.skc .skb { position: absolute; right: 0; top: 4px; bottom: 4px; background: var(--bar); z-index: 0; }
  table.ser td.skc b { position: relative; font-size: 1.15rem; }
  .zpick { display: flex; gap: 12px; align-items: flex-end; margin: 0 0 12px; flex-wrap: wrap; }
  .zpick > div { flex: 1 1 200px; }
  .zpick label { display: block; font-size: .8rem; color: var(--muted); font-weight: 600; }
  .zcols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 32px; }
  @media (max-width: 900px) { .zcols { grid-template-columns: 1fr; } }

  .two { display: block; }
  @media (min-width: 1100px) {
    .wrap { max-width: 1420px; }
    .two.sd { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 36px; align-items: start; }
    .two.sd .colR { position: sticky; top: 16px; }
  }

  /* milníky */
  .mil-next { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  .mil-next b { display: block; font: 700 1.7rem/1.1 var(--f-chalk); }
  .mil-next .mt-g b { color: var(--blue); } .mil-next .mt-z b { color: var(--muted); }
  .cg { color: var(--blue); font-weight: 700; } .ca { color: var(--y); font-weight: 700; } .cb { color: var(--chalk); font-weight: 700; }
  .mil-next span { color: var(--muted); font-weight: 600; font-size: .88rem; }
  .mil-next i { font-style: normal; display: block; font-size: .85rem; color: var(--muted); }
  ul.mil { list-style: none; margin: 0; padding: 0; }
  ul.mil li { display: flex; gap: 12px; align-items: baseline; padding: 4px 0; border-bottom: 1px dashed rgba(239,238,230,.18); }
  ul.mil li .ic { flex: none; width: 1.8em; height: 1.8em; line-height: 1.8em; border-radius: 3px; text-align: center; font: 700 .78rem var(--f-chalk); position: relative; top: -1px; }
  ul.mil li .ic-g { background: var(--blue); color: #fff; }
  ul.mil li .ic-b { background: var(--chalk); color: var(--board); }
  ul.mil li .ic-z { border: 1.5px solid var(--line); color: var(--muted); line-height: 1.55em; }
  ul.mil li .t { white-space: nowrap; font-weight: 600; }
  ul.mil li .w { color: var(--muted); font-size: .88rem; margin-left: auto; text-align: right; }
  .solo .mil-team { display: none; }

  /* heatmapa */
  .hm-bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-bottom: 10px; }
  .hm-bar .seg { margin: 0; flex: 0 1 auto; border-bottom: 0; }
  .hm-bar .seg button { font-size: .9rem; padding-bottom: 6px; }
  .hm-scroll { overflow: auto; max-height: 78vh; margin: 0 -4px; }
  table.hm { border-collapse: separate; border-spacing: 2px; width: auto; font-size: .82rem; }
  table.hm th { position: sticky; top: 0; z-index: 2; background: var(--board); padding: 6px 2px; text-align: center; color: var(--chalk); font-weight: 600; min-width: 38px; border-bottom: 0; }
  table.hm th::after { content: ""; }
  table.hm th.on { color: var(--y); box-shadow: inset 0 -2px 0 var(--y); }
  table.hm th:first-child, table.hm td.hp { position: sticky; left: 0; z-index: 3; text-align: left; background: var(--board); min-width: 104px; padding-left: 0; }
  table.hm td { padding: 0; border: 0; text-align: center; height: 30px; min-width: 38px; border-radius: 6px; }
  table.hm td.hp { cursor: pointer; white-space: nowrap; padding-right: 6px; }
  table.hm td.hp .no { color: var(--muted); font-size: .75rem; margin-right: 4px; }
  table.hm td { font-weight: 600; }
  table.hm td.hc { cursor: pointer; opacity: 0; animation: hmIn .35s ease forwards; animation-delay: calc(var(--i) * 18ms); }
  table.hm td.hc:hover { outline: 2px solid var(--y); outline-offset: -1px; }
  table.hm tr.sumrow td, table.hm td.tot { background: var(--field); color: var(--chalk); }
  @keyframes hmIn { from { opacity: 0; transform: scale(.7); } to { opacity: var(--o, 1); transform: none; } }
  @media (prefers-reduced-motion: reduce) { table.hm td.hc { animation: none; opacity: var(--o, 1); } }
  .legend { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; margin-top: 10px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 120px; height: 10px; border-radius: 5px; }
  #tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ontip); color: var(--board); font-size: .85rem; line-height: 1.3; padding: 6px 12px; max-width: 260px; opacity: 0; transition: opacity .12s; border-radius: var(--wonky); }
  #tip b { display: block; }

  /* karta hráče ke stažení */
  .pc-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .pc-wrap svg { width: 100%; max-width: 340px; height: auto; border: 1px solid var(--line); border-radius: 3px; }

  /* režim jen pro jednoho hráče (odkaz s #hrac=Jméno&solo=1) */
  .solo .seg, .solo .f-main, .solo .pickmode, .solo #chips, .solo #pristi, .solo #rekordy, .solo #heat,
  .solo #kontrola, .solo #manual, .solo .updated a, .solo #linkBtn, .solo #linkSolo { display: none !important; }

  @media (max-width: 640px) {
    body { padding: 14px 14px calc(30px + env(safe-area-inset-bottom)); }
    .filters { grid-template-columns: 1fr 1fr; }
    .tile { margin-right: 14px; padding-right: 8px; }
    .mil-next { grid-template-columns: 1fr; }
    ul.mil li { flex-wrap: wrap; }
    ul.mil li .w { margin-left: 0; text-align: left; flex-basis: 100%; padding-left: 2.4em; }
    table { font-size: 1.05rem; }
    th, td { padding: 5px 3px; }

    .hide-m { display: none; }
    td.opp .full { display: none; }
    td.tld, th.tld { display: none; }
    }
</style>

<style id="saas">
/* ===== SaaS dashboard vzhled (Linear / Vercel / Stripe) — přepisuje starší tabulový styl ===== */
:root {
  --f-ui: "Inter Variable", "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg0:#ffffff; --surf:#ffffff; --surf2:#f6f7f9; --ink:#0b0d12; --ink2:#3b4252; --mut:#7a8294;
  --hair:#e8eaee; --hair2:#f0f1f4; --acc:#4f46e5; --acc-s:rgba(79,70,229,.09);
  --g:#2563eb; --a:#ea580c; --ok:#10b981; --bad:#f43f5e; --warnc:#d97706;
  --glow-ok:0 0 0 3px rgba(16,185,129,.16), 0 0 10px rgba(16,185,129,.45);
  --glow-bad:0 0 0 3px rgba(244,63,94,.14), 0 0 10px rgba(244,63,94,.4);
  --r:14px;
  --board:#ffffff; --chalk:var(--ink); --muted:var(--mut); --line:var(--hair); --y:var(--a); --red:var(--bad); --blue:var(--g); --green:#059669;
  --warn:var(--warnc); --gab:rgba(79,70,229,.045); --bar:rgba(79,70,229,.14); --field:#f4f5f8; --hm0:#f1f2f5; --navy:var(--ink);
  --tint-ui:#eef3fb; --tint-hi:#fdf3e6; --ontip:#0b0d12; --pillon:#0b0d12; --noise:none; --f-hand:var(--f-ui); --f-chalk:var(--f-ui);
  --wonky:8px; --ellipse:none; --uline:none;
}
:root[data-theme="dark"] {
  --bg0:#08090b; --surf:#0f1114; --surf2:#15181c; --ink:#f4f5f7; --ink2:#c2c7d0; --mut:#868d9b;
  --hair:rgba(255,255,255,.07); --hair2:rgba(255,255,255,.045); --acc:#a5a6ff; --acc-s:rgba(165,166,255,.12);
  --g:#7aa8ff; --a:#ffa45c; --ok:#34d399; --bad:#fb7185; --warnc:#fbbf24;
  --glow-ok:0 0 0 3px rgba(52,211,153,.14), 0 0 12px rgba(52,211,153,.55);
  --glow-bad:0 0 0 3px rgba(251,113,133,.14), 0 0 12px rgba(251,113,133,.5);
  --board:#08090b; --green:#34d399; --gab:rgba(165,166,255,.06); --bar:rgba(165,166,255,.2); --field:#15181c; --hm0:rgba(255,255,255,.05);
  --ontip:#f4f5f7; --pillon:#f4f5f7; --noise:none; --tint-ui:rgba(122,168,255,.07); --tint-hi:rgba(255,164,92,.07);
}

html { background: var(--bg0); }
body { font-family: var(--f-ui); font-feature-settings: "cv11","ss01","tnum"; -webkit-font-smoothing: antialiased; background: var(--bg0); color: var(--ink); font-size: 15px; line-height: 1.45; letter-spacing: -.005em; }
:root[data-theme="dark"] body { background: radial-gradient(900px 420px at 12% -8%, rgba(120,119,255,.10), transparent 70%), var(--bg0); }
.wrap { max-width: 1160px; }
h1 { font: 800 clamp(1.55rem, 2.6vw, 1.95rem)/1.1 var(--f-ui); letter-spacing: -.035em; margin: 2px 0 0; }
.updated { color: var(--mut); font-size: .82rem; margin: 6px 0 22px; }
.updated a { color: var(--ink2); text-decoration: none; border-bottom: 1px solid var(--hair); }
.updated a:hover { color: var(--ink); border-color: var(--ink2); }
.theme-btn { border: 1px solid var(--hair); border-radius: 9px; background: var(--surf); color: var(--ink2); width: 36px; height: 32px; }
.theme-btn:hover { color: var(--ink); background: var(--surf2); }

/* karty */
.card { background: var(--surf); border: 1px solid var(--hair); border-radius: var(--r); padding: 20px 22px; margin-bottom: 14px; box-shadow: none; }
.card::before { content: none; }
.card.t-ui { background: var(--tint-ui); border-color: color-mix(in srgb, var(--g) 16%, var(--hair)); }
.card.t-hi { background: var(--tint-hi); border-color: color-mix(in srgb, var(--a) 18%, var(--hair)); }
.t-ui select, .t-ui input[type=search], .t-ui .search input { background: var(--surf); }
.t-hi .mil-next > div, .t-hi .tile { background: var(--surf); }
ul.facts { background: var(--tint-hi); border-radius: 10px; padding: 4px 14px; }
ul.h2h { background: var(--tint-ui); border-radius: 10px; padding: 6px 14px; }
.card h2, details > summary { font: 600 .95rem/1.2 var(--f-ui); letter-spacing: -.01em; color: var(--ink); margin: 0 0 14px; }
details > summary::before { content: "▸"; color: var(--mut); margin-right: 8px; font-size: .8em; }
details[open] > summary::before { content: "▾"; }
.muted { color: var(--mut); }
:root[data-theme="dark"] .card:not(.t-ui):not(.t-hi) { background: linear-gradient(180deg, rgba(255,255,255,.025), transparent 60%), var(--surf); }

/* záložky = segmentovaný přepínač */
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 0; background: var(--surf2); border-radius: 10px; margin-bottom: 18px; max-width: 100%; }
:root[data-theme="dark"] .seg { background: rgba(255,255,255,.045); }
.seg button, .seg button.on { border: 0; margin: 0; border-radius: 7px; padding: 7px 13px; font: 500 .84rem/1 var(--f-ui); color: var(--mut); letter-spacing: -.005em; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--surf); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--hair), 0 1px 2px rgba(0,0,0,.04); }
:root[data-theme="dark"] .seg button.on { background: rgba(255,255,255,.09); box-shadow: 0 0 0 1px rgba(255,255,255,.06); }
.hm-bar .seg { margin: 0; }

/* formuláře */
.filters label, .fgrid label { font: 500 .72rem var(--f-ui); color: var(--mut); letter-spacing: .01em; margin-bottom: 5px; }
select, input[type=text], input[type=search], textarea { background: var(--surf); border: 1px solid var(--hair); border-radius: 9px; padding: 8px 10px; color: var(--ink); font-size: .9rem; transition: border-color .12s, box-shadow .12s; }
:root[data-theme="dark"] select, :root[data-theme="dark"] input[type=text], :root[data-theme="dark"] input[type=search], :root[data-theme="dark"] textarea { background: var(--surf2); }
select:hover, input:hover { border-color: color-mix(in srgb, var(--ink) 22%, transparent); }
select:focus, input:focus, textarea:focus { outline: 0; border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-s); }
.search input { border-radius: 10px; padding: 11px 14px; background: var(--surf2); font-size: .95rem; }
.hres { border: 1px solid var(--hair); border-radius: 12px; background: var(--surf); box-shadow: 0 12px 32px -12px rgba(0,0,0,.25); }
.hres button { border-bottom: 1px solid var(--hair2); padding: 9px 14px; }
.hres button:hover, .hres button.hi { background: var(--acc-s); color: var(--ink); }
.fltr summary { border: 1px solid var(--hair); border-radius: 9px; padding: 6px 11px; color: var(--ink2); font: 500 .8rem var(--f-ui); }
.fltr summary.on { background: var(--acc-s); border-color: transparent; color: var(--acc); }
.pickmode button { font: 500 .8rem var(--f-ui); }
.pickmode button.on { color: var(--ink); border-bottom: 2px solid var(--acc); }
button.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg0); border-radius: 9px; padding: 7px 14px; font: 500 .82rem var(--f-ui); }
button.btn:hover { opacity: .88; background: var(--ink); color: var(--bg0); }
button.btn.sec { background: var(--surf); color: var(--ink); border-color: var(--hair); }
button.btn.sec:hover { background: var(--surf2); border-color: color-mix(in srgb, var(--ink) 25%, transparent); color: var(--ink); }

/* soupiska = pilulky */
.chips { gap: 6px; margin: 6px 0; }
.chip { border: 1px solid var(--hair); border-radius: 999px; padding: 5px 12px; font-size: .84rem; color: var(--ink2); background: var(--surf); transition: background .12s, border-color .12s; }
.chip:hover { color: var(--ink); background: var(--surf2); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg0); box-shadow: none; }
.chip.on .no { color: var(--bg0); opacity: .6; }
.chip .no { font-size: .72rem; }

/* kluby = tečky se září */
.tdot, .chip[style*="--tg"]::before { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 3px color-mix(in srgb, var(--tg, var(--mut)) 18%, transparent), 0 0 9px color-mix(in srgb, var(--tg, var(--mut)) 55%, transparent); vertical-align: 0; margin-right: 9px; }
.chip[style*="--tg"]::before { content: ""; display: inline-block; background: var(--tg); margin-right: 8px; }

/* KPI = bento */
.tiles { margin: 20px 0 6px; }
.sbn { border: 0; padding: 0 0 14px; align-items: baseline; gap: 0 12px; }
.sbn b { font: 800 clamp(1.7rem, 3vw, 2.1rem)/1.05 var(--f-ui); letter-spacing: -.04em; }
.sbn span { font: 400 .92rem var(--f-ui); color: var(--mut); }
.sbn i { font: 500 .9rem var(--f-ui); color: var(--mut); }
.sbs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 4px; }

function inferTeams(rows,home){
  var bySeason={};
  rows.forEach(function(r){r.team=null;r.amb=false;(bySeason[r.season]=bySeason[r.season]||[]).push(r)});
  Object.keys(bySeason).forEach(function(k){
    var g=bySeason[k].sort(function(x,y){return x.dt<y.dt?-1:1}),run=[],cand=null;
    function flush(){
      if(!run.length)return;
      var t=cand&&cand.length===1?cand[0]:null;
      run.forEach(function(r){r.team=t;r.amb=!t});
      run=[];cand=null;
    }
    g.forEach(function(r){
      var s=[r.a,r.b];
      if(cand===null){cand=s;run=[r];return}
      var inter=cand.filter(function(x){return s.indexOf(x)>-1});
      if(inter.length){cand=inter;run.push(r)}else{flush();cand=s;run=[r]}
    });
    flush();
  });
  // ruční určení týmu (bilance_rucne.json) a pravidlo: nejednoznačný zápas
  // aktuální sezóny proti CEB hrál hráč Motoru za Motor
  rows.forEach(function(r){
    if(r.fix&&(r.fix===r.a||r.fix===r.b)){r.team=r.fix;r.amb=false}
    else if(r.amb&&home&&r.season===CUR&&(r.a===home||r.b===home)){r.team=home;r.amb=false}
  });
  rows.forEach(function(r){r.mine=!!home&&r.team===home});
  // zbylé nejasné zápasy: tým z nejbližšího jasného zápasu (dřív, jinak později), pokud v tom zápase hrál
  var srt=rows.slice().sort(function(x,y){return x.dt<y.dt?-1:x.dt>y.dt?1:0});
  srt.forEach(function(r,i){
    if(r.team||!r.amb)return;
    var j,t=null;
    for(j=i-1;j>=0;j--)if(srt[j].team){t=srt[j].team;break}
    if(t!==r.a&&t!==r.b){t=null;for(j=i+1;j<srt.length;j++)if(srt[j].team){t=srt[j].team;break}}
    if(t===r.a||t===r.b){r.team=t;r.amb=false;r.odhad=true}
  });
}

function milGrid(k,max){var out=[],v;
  if(k==='z'){if(max>=1)out.push(1);for(v=100;v<=max;v+=100)out.push(v)}
  else if(k==='g'){[1,25,50].forEach(function(x){if(x<=max)out.push(x)});for(v=100;v<=max;v+=50)out.push(v)}
  else{[1,50].forEach(function(x){if(x<=max)out.push(x)});for(v=100;v<=max;v+=100)out.push(v)}
  return out}
function milNext(k,cur){var v=cur+1;
  if(k==='z')return v<=1?1:Math.ceil(v/100)*100;
  if(k==='g'){if(v<=1)return 1;if(v<=25)return 25;if(v<=50)return 50;return Math.ceil(v/50)*50}
  if(v<=1)return 1;if(v<=50)return 50;if(v<=100)return 100;return Math.ceil(v/100)*100}
function milCalc(n){
  var comp=$('comp').value,rows=allRowsFor(n).filter(function(r){return !comp||r.comp===comp});
  rows.sort(function(x,y){return x.dt<y.dt?-1:x.dt>y.dt?1:0});
  var cum={z:0,g:0,b:0},T={z:[],g:[],b:[]},items=[],i,k,pos={z:0,g:0,b:0};
  var tot={z:rows.length,g:0,b:0};rows.forEach(function(r){tot.g+=r.g;tot.b+=r.p});
  ['z','g','b'].forEach(function(kk){T[kk]=milGrid(kk,tot[kk])});
  rows.forEach(function(r){
    var add={z:1,g:r.g,b:r.p};
    ['z','g','b'].forEach(function(kk){
      cum[kk]+=add[kk];
      while(pos[kk]<T[kk].length&&cum[kk]>=T[kk][pos[kk]]){items.push({k:kk,n:T[kk][pos[kk]],r:r,add:add[kk],cum:cum[kk]});pos[kk]++}
    });
  });
  var next={};['z','g','b'].forEach(function(kk){var t=milNext(kk,tot[kk]);next[kk]={t:t,left:t-tot[kk]}});
  return {items:items,tot:tot,next:next};
}

function allReady(){if(allLoaded())return true;loadClub('').then(function(){if(mode==='S')renderS()}).catch(function(){});return false}
function isPO(r){return /play\s*-?\s*(off|out)|baráž/i.test(r.comp)}
function cmpDt(a,b){return a<b?-1:a>b?1:0}

  var m={};

    if(r.season!==CUR)return;

    if(r.dt<o.min)o.min=r.dt;if(r.dt>o.max)o.max=r.dt;
  })});

}

function streakEnd(rs,i,want){var k=0;while(i-k>=0&&(rs[i-k].p>0)===want)k++;return k}
function gabCells(g,a,b){return '<td class="gab g'+(g?'':' zero')+'">'+g+'</td><td class="gab a'+(a?'':' zero')+'">'+a+'</td><td class="gab pts'+(b?'':' zero')+'">'+b+'</td>'}

  h+='<div class="kstats"><div><b>'+nGames+'</b><span>zápasů</span></div><div><b>'+PL.length+'</b><span>bruslařů v datech</span></div><div><b>'+withPt+'</b><span>s bodem</span></div><div><b>'+hats.length+'</b><span>hattricků</span></div><div><b>'+so.length+'</b><span>nul brankářů</span></div></div>';
  h+=sect('Nejlepší výkony kola',tbl(playerHead()+gabHead()+'<th class="hide-m">+/-</th><th class="l">Soupeř</th>',top.map(function(x,i){var o=opp(x.r);

/* ---------- Přehled klubu ---------- */
function toolKlub(){

  if(codes.indexOf(k)<0)k=codes[0];
  if(!LOADED[k]){loadClub(k).then(function(){if(mode==='S')renderS()}).catch(function(){});return LOADING}
  var nm={};CLUBS.forEach(function(c){nm[c.kod]=c.nazev});
  var ns=Object.keys(EMB).filter(function(n){return KLUB[n]===k&&!isGone(n,CUR)}),P=[],match={};
  ns.forEach(function(n){
    var rs=sortedCur(n,'');if(!rs.length)return;
    var t=agg(rs),l5=agg(rs.slice(-5)),ps=streakEnd(rs,rs.length-1,true),ns0=streakEnd(rs,rs.length-1,false);
    P.push({n:n,t:t,l5:l5,z:rs.length,ps:ps,np:ns0});
    rs.forEach(function(r){if(r.a===k||r.b===k)match[r.dt+'|'+r.a+'|'+r.b]=r});
  });
  var M=Object.keys(match).map(function(x){return match[x]}).sort(function(a,b){return cmpDt(a.dt,b.dt)});
  var w=0,l=0,gf=0,ga0=0;
  M.forEach(function(r){if(r.sa==null)return;var home=r.a===k,mine=home?r.sa:r.sb,th=home?r.sb:r.sa;gf+=mine;ga0+=th;if(mine>th)w++;else l++});
  var h='<div class="sctl"><label for="tKs">Klub</label>'+sel('tKs',codes,k,function(c){return nm[c]||c})+'</div>';
  h+='<div class="kstats"><div><b>'+M.length+'</b><span>zápasů</span></div><div><b>'+w+'–'+l+'</b><span>výher–porážek</span></div><div><b>'+gf+':'+ga0+'</b><span>skóre</span></div><div><b>'+P.length+'</b><span>hráčů se zápasem</span></div></div>';
  if(M.length)h+='<div class="kform">'+M.slice(-10).map(function(r){var home=r.a===k,mine=home?r.sa:r.sb,th=home?r.sb:r.sa,o=home?r.b:r.a,v=mine>th;
    return '<span class="kf '+(v?'w':'l')+'" title="'+fdate(r.dt)+(home?' doma ':' venku ')+o+'"><b>'+(v?'V':'P')+'</b> '+mine+':'+th+'<i>'+o+'</i></span>'}).join('')+'</div>';
  function box(title,list,fmt,note){return '<div class="lead"><h4>'+title+'</h4>'+(list.length?'<ol>'+list.slice(0,5).map(function(x){return '<li><b>'+plink(x.n)+'</b><span class="kv">'+fmt(x)+'</span></li>'}).join('')+'</ol>':'<p class="muted small">'+(note||'Nikdo.')+'</p>')+'</div>'}

    +box('Góly',by(function(x){return x.t.g}).filter(function(x){return x.t.g>0}),function(x){return '<b class="cg">'+x.t.g+'</b>'})
    +box('Asistence',by(function(x){return x.t.a}).filter(function(x){return x.t.a>0}),function(x){return '<b class="ca">'+x.t.a+'</b>'})

    +box('Série s bodem',by(function(x){return x.ps}).filter(function(x){return x.ps>=3}),function(x){return '<b>'+x.ps+'</b> z.'},'Nikdo od 3 zápasů.')
    +box('Dlouho bez bodu',by(function(x){return x.np}).filter(function(x){return x.np>=5}),function(x){return '<b>'+x.np+'</b> z.'},'Nikdo od 5 zápasů.')
    +'</div>';

/* ---------- Porovnání dvou hráčů ---------- */
function toolCmp(){
  if(!allReady())return LOADING;
  var names=Object.keys(EMB).sort(byName);
  var def=names.map(function(n){return {n:n,b:agg(INFR(n).filter(function(r){return r.season===CUR})).b}}).sort(function(x,y){return y.b-x.b});
  var a=EMB[SS.vA]?SS.vA:(def[0]&&def[0].n),b=EMB[SS.vB]&&SS.vB!==a?SS.vB:(def.filter(function(x){return x.n!==a})[0]||{}).n;
  if(!a||!b)return {h:'<p class="muted">Nejsou data.</p>',bind:function(){}};
  function info(n){

SS.pM='K';SS.pK='';SS.pC='';SS.pP='';SS.pH={};
function dniTxt(n){return n+' '+(n===1?'den':(n>=2&&n<=4?'dny':'dní'))}
function poZ(n){return n+' '+(n===1?'zápase':'zápasech')}

function storyCtx(){
  var C={cur:{},ps:[]};
  Object.keys(EMB).forEach(function(n){
    var all=INFR(n).slice().sort(function(x,y){return cmpDt(x.dt,y.dt)}),by={};
    var cur=all.filter(function(r){return r.season===CUR});
    if(cur.length)C.cur[n]=agg(cur);
    all.forEach(function(r){if(!isPO(r))(by[r.season]=by[r.season]||[]).push(r)});
    Object.keys(by).forEach(function(s){var c=0,cum=by[s].map(function(r){c+=r.p;return c});C.ps.push({n:n,s:+s,cum:cum})});
  });
  C.ns=Object.keys(C.cur);
  return C;
}
function rankOf(C,f,n){var v=f(C.cur[n]),k=1;C.ns.forEach(function(m){if(f(C.cur[m])>v)k++});return k}

function playerStories(n,C,focusKey,withCtx){
  var all=INFR(n).slice().sort(function(x,y){return cmpDt(x.dt,y.dt)}),out=[],idxs=[];
  function add(sc,type,h){out.push({n:n,s:sc,k:type,h:h,g:false})}
  if(focusKey)all.forEach(function(r,i){if(roundKey(r)===focusKey&&r.season===CUR)idxs.push(i)});
  else if(all.length&&all[all.length-1].season===CUR)idxs=[all.length-1];
  var mil=null;
  idxs.forEach(function(i){
    var r=all[i],before=all.slice(0,i),o=opp(r),O=o?'<b>'+o+'</b>':'soupeři',gaTxt=ga(r.g,r.as)+' = '+r.p+' b',goalStory=false;
    /* výkon v zápase */
    if(r.g>=3){var hats=before.filter(function(x){return x.g>=3}).length;
      add(hats?60:85,'Výkon',hats?('Hattrick'+(o?' proti '+O:'')+' – '+(hats+1)+'. v datech'):('První hattrick v datech'+(o?' – proti '+O:'')+' ('+r.g+' góly)'))}
    else if(r.p>=3&&before.length>=20){var mx=0;before.forEach(function(x){if(x.p>mx)mx=x.p});if(r.p>mx)add(52+r.p,'Výkon','Osobní rekord v bodech v jednom zápase: '+gaTxt+(o?' proti '+O:''))}
    /* série gólů a bodů */
    if(r.g>0){var k=0;while(k<before.length&&before[before.length-1-k].g===0)k++;
      if(k>=8){var lg=null;for(var q=before.length-1;q>=0;q--)if(before[q].g>0){lg=before[q];break}
        add(40+Math.min(k,45),'Série','První gól po '+poZ(k)+' bez gólu'+(lg?' (předtím '+fdate(lg.dt)+')':''));goalStory=true}}
    if(!goalStory&&r.p>0){var k2=0;while(k2<before.length&&before[before.length-1-k2].p===0)k2++;
      if(k2>=6)add(34+Math.min(k2,40),'Série','První bod po '+poZ(k2)+' bez bodu')}
    /* návrat po pauze */
    var prev=before[before.length-1];
    if(prev){
      if(r.season-prev.season>=2)add(58,'Návrat','Vrací se do extraligových dat po '+(r.season-prev.season-1)+' sezónách pauzy (naposledy '+seasonLabel(prev.season)+')');
      else if(prev.season===r.season){var gap=daysBetween(prev.dt,r.dt);if(gap>=28)add(30+Math.min(Math.round(gap/2),35),'Návrat','Vrátil se po '+dniTxt(gap)+' (předchozí zápas '+fdate(prev.dt)+')'+(r.p>0?' a bodoval ('+gaTxt+')':''))}
    }
    /* proti soupeři */
    if(o){
      var vs=before.filter(function(x){return opp(x)===o}),vg=0,vp=0;vs.forEach(function(x){vg+=x.g;vp+=x.p});
      if(r.g>0&&vs.length>=4&&vg===0)add(50+Math.min(vs.length,20),'Soupeř','První gól proti '+O+' – až v '+(vs.length+1)+'. zápase proti němu');
      else if(r.p>0&&vs.length>=4&&vp===0)add(40+Math.min(vs.length,20),'Soupeř','První bod proti '+O+' po '+poZ(vs.length)+' bez bodu');
      else if(r.p===0&&vs.length>=3&&vp===0)add(24+vs.length,'Soupeř','Proti '+O+' nebodoval už '+(vs.length+1)+' '+cz(vs.length+1,'z')+' v řadě');
      var fm=before.filter(function(x){return x.team===o&&x.season<r.season}),fs={};fm.forEach(function(x){fs[x.season]=1});
      if(fm.length>=10&&KLUB[n]!==o)add(45+(r.p>0?10:0),'Bývalý klub','Hrál proti bývalému klubu '+O+' ('+seasonsTxt(Object.keys(fs).map(Number).sort())+')'+(r.p>0?' a bodoval ('+gaTxt+')':''));
    }
    /* milník */
    if(!mil)mil=milCalc(n).items;
    mil.forEach(function(it){if(it.r===r&&it.n>1){var T=MTYPE[it.k];add(it.n>=100?72:50,'Milník',(it.k==='z'?'Odehrál ':'Překonal ')+'<b>'+it.n+'. '+T.lbl+'</b> v extralize')}});
    /* debut */
    if(i===0&&r.season>dataStart())add(60+(r.p>0?15:0),'Debut','Debut v extralize'+(o?' proti '+O:'')+(r.p>0?' – a hned bodoval ('+gaTxt+')':''));
  });
  if(withCtx&&C.cur[n]){
    var c=C.cur[n],cur=all.filter(function(r){return r.season===CUR}),reg=cur.filter(function(r){return !isPO(r)});
    if(c.z>=5){
      var rb=rankOf(C,function(a){return a.b},n),rg=rankOf(C,function(a){return a.g},n);
      if(rb<=5)add(30+(6-rb)*4,'Pořadí',rb+'. nejproduktivnější hráč ligy ('+c.b+' b v '+c.z+' z.)');
      if(rg<=3&&c.g>=3)add(28+(4-rg)*4,'Pořadí',rg+'. nejlepší střelec ligy ('+c.g+' gólů)');
      if(KLUB[n]){var cl=C.ns.filter(function(m){return KLUB[m]===KLUB[n]}).sort(function(a,b){return C.cur[b].b-C.cur[a].b});
        if(cl.length>=8&&cl[0]===n&&rb>5)add(24,'Pořadí','Nejproduktivnější hráč klubu '+clubNm(KLUB[n])+' ('+c.b+' b)')}
    }
    var k=reg.length,pts=0;reg.forEach(function(r){pts+=r.p});
    if(k>=8&&pts>=10){
      var rk=1,tot=0;C.ps.forEach(function(x){if(x.cum.length>=k){tot++;if(x.cum[k-1]>pts)rk++}});
      if(rk<=5&&tot>=40)add(50+(6-rk)*5,'Pořadí',rk+'. nejlepší bodový start sezóny v datech: '+pts+' b po '+poZ(k)+' (srovnání se '+tot+' sezónami hráčů)');
    }
    var car=agg(all.filter(function(r){return r.season<CUR}));
    if(c.z>=15&&car.z>=80&&car.b>0){
      var a=c.b/c.z,b0=car.b/car.z,ratio=a/b0;
      if(ratio>=1.5&&a-b0>=0.3)add(45+Math.min(Math.round(ratio*10),30),'Forma','Nadprůměrná sezóna: '+dc(a)+' b/z oproti kariérním '+dc(b0)+' (+'+Math.round((ratio-1)*100)+' %)');
      else if(ratio<=0.6&&b0>=0.4)add(40+Math.min(Math.round((1-ratio)*40),20),'Forma','Propad: '+dc(a)+' b/z oproti kariérním '+dc(b0)+' ('+Math.round((ratio-1)*100)+' %)');
    }
    if(cur.length&&daysBetween(cur[cur.length-1].dt,'9999-12-31')>0){
      var sp=0;while(sp<cur.length&&cur[cur.length-1-sp].p>0)sp++;
      if(sp>=8)add(30+sp,'Série','Aktuální série s bodem: '+sp+' '+cz(sp,'z')+' ('+ga(agg(cur.slice(-sp)).g,agg(cur.slice(-sp)).a)+')');
      var sg=0;while(sg<cur.length&&cur[cur.length-1-sg].g===0)sg++;
      if(sg>=12&&car.g+c.g>=30)add(26+Math.round(sg/2),'Série','Bez gólu už '+sg+' '+cz(sg,'z'));
      var sn=0;while(sn<cur.length&&cur[cur.length-1-sn].p===0)sn++;
      if(sn>=10)add(24+sn,'Série','Bez bodu už '+sn+' '+cz(sn,'z'));
    }
  }
  return out;
}

      var before=all.slice(0,i),o=opp(r),O=o?'<b>'+o+'</b>':'soupeři',sh=r.as+r.p;
      function add(sc,type,h){out.push({n:n,s:sc,k:type,h:h,g:true})}
      if(r.p===0&&r.g>=55){
        var sc=0,cr=0;before.forEach(function(x){if(x.p===0&&x.g>=55){cr++;if(x.season===CUR)sc++}});
        add(58+Math.min(sc,6),'Brankář','Nula'+(o?' proti '+O:'')+' ('+r.as+' zákroků) – '+(sc+1)+'. v sezóně, '+(cr+1)+'. v datech');
      }else if(sh>=25&&r.as/sh>=0.95&&r.g>=55)add(42,'Brankář','Zákroků '+r.as+' z '+sh+' ('+dc(r.as/sh*100)+' %)'+(o?' proti '+O:''));
      var prev=before[before.length-1];
      if(prev&&prev.season===r.season){var gap=daysBetween(prev.dt,r.dt);if(gap>=28)add(30+Math.min(Math.round(gap/2),30),'Návrat','Brankář se vrátil po '+dniTxt(gap)+' (předchozí zápas '+fdate(prev.dt)+')')}
      var fm=before.filter(function(x){return x.team===o&&x.season<r.season}),fs={};fm.forEach(function(x){fs[x.season]=1});

      return '<li><span class="tag">'+x.k+'</span><div><b>'+(x.g?glink(x.n):plink(x.n))+'</b> '+(kl?'<span class="muted">'+tdot(kl)+kl+'</span>':'')+'<div class="stx">'+x.h+'</div></div></li>'}).join('')+'</ol>';

function mkey(r){return r.dt+'|'+r.a+'|'+r.b}

/* ---------- společné: zápasy týmů ---------- */
function teamMatches(){
  var seen={},TM={};
  Object.keys(EMB).forEach(function(n){EMB[n].forEach(function(r){
    var k=mkey(r);if(seen[k])return;seen[k]=1;
    var m={key:k,dt:r.dt,a:r.a,b:r.b,sa:r.sa,sb:r.sb,ot:r.ot,comp:r.comp,season:r.season};
    (TM[r.a]=TM[r.a]||[]).push(m);(TM[r.b]=TM[r.b]||[]).push(m);
  })});
  Object.keys(TM).forEach(function(T){TM[T].sort(function(x,y){return cmpDt(x.dt,y.dt)||cmpDt(x.key,y.key)})});
  return TM;
}

/* ---------- Železní muži ---------- */
function ironData(){
  var TM=teamMatches(),idx={},res=[];
  Object.keys(TM).forEach(function(T){idx[T]={};TM[T].forEach(function(m,i){idx[T][m.key]=i})});
  Object.keys(EMB).forEach(function(n){
    var byT={};
    INFR(n).forEach(function(r){var T=r.team;if(!T||!idx[T])return;var i=idx[T][mkey(r)];if(i==null)return;(byT[T]=byT[T]||{})[i]=1});
    Object.keys(byT).forEach(function(T){
      var ix=Object.keys(byT[T]).map(Number).sort(function(a,b){return a-b}),best=null,run=null,last=TM[T].length-1,i;
      for(i=0;i<ix.length;i++){
        if(run&&ix[i]===run.end+1)run.end=ix[i];else{run={start:ix[i],end:ix[i]}}
        run.len=run.end-run.start+1;
        if(!best||run.len>best.len)best={start:run.start,end:run.end,len:run.len};
      }
      var cur={start:run.start,end:run.end,len:run.len};
      if(best.len<10)return;
      res.push({n:n,T:T,best:best,cur:cur,TM:TM[T],last:last,active:cur.end===last});
    });
  });
  return res;
}
function runTxt(x,run){var a=x.TM[run.start],b=x.TM[run.end];return fdate(a.dt)+' – '+fdate(b.dt)}
function toolIron(){
  if(!allReady())return LOADING;
  var D=ironData(),V=SS.wV,rows;
  function ok(x){return !SS.wC||x.T===SS.wC}
  if(V==='A')rows=D.filter(function(x){return x.active&&ok(x)&&KLUB[x.n]===x.T}).sort(function(a,b){return b.cur.len-a.cur.len});
  else if(V==='M')rows=D.filter(ok).sort(function(a,b){return b.best.len-a.best.len});
  else rows=D.filter(function(x){var miss=x.last-x.cur.end,ld=x.TM[x.cur.end].dt,tl=x.TM[x.last].dt;return !x.active&&ok(x)&&KLUB[x.n]===x.T&&x.cur.len>=20&&miss>=1&&miss<=6&&daysBetween(ld,tl)<=45}).sort(function(a,b){return b.cur.len-a.cur.len});
  var firstIdx=function(x,run){return run.start===0};
  var total=rows.length;rows=rows.slice(0,30);
  var h=segHtml('wvSeg',[['A','Aktuální série'],['M','Nejdelší v datech'],['B','Právě přerušená']],V)+'<div class="sctl">'+clubSel('wC',SS.wC)+'</div>';
  if(!rows.length)h+='<p class="muted">Nic nenalezeno.</p>';
  else{
    var maxL=Math.max.apply(null,rows.map(function(x){return V==='M'?x.best.len:x.cur.len}));
    h+='<div class="tblwrap"><table class="ser"><thead><tr>'+playerHead().replace('Klub','Za klub')+'<th>Zápasů v řadě</th><th class="l">Od – do</th>'+(V==='B'?'<th>Chybí už</th>':'<th class="l hide-m">Pozn.</th>')+'</tr></thead><tbody>'
      +rows.map(function(x,i){
        var run=V==='M'?x.best:x.cur,w=Math.max(4,Math.round(run.len/maxL*100)),miss=x.last-x.cur.end,min=firstIdx(x,run)?'min. ':'';
        return '<tr><td class="l muted">'+(i+1)+'</td><td class="l"><b>'+plink(x.n)+'</b><span class="kmob muted"> '+x.T+'</span></td><td class="l hide-m">'+tdot(x.T)+'<b>'+x.T+'</b></td>'
          +'<td class="skc"><span class="skb" style="width:'+w+'%"></span><b>'+min+run.len+'</b></td><td class="l">'+runTxt(x,run)+'</td>'
          +(V==='B'?'<td>'+miss+' z.</td>':'<td class="l hide-m muted">'+(V==='M'&&x.active&&x.best.end===x.cur.end?'trvá':(min?'v datech od začátku':''))+'</td>')+'</tr>'}).join('')
      +'</tbody></table></div>';
  }
  h+=(total>rows.length?'<p class="small muted">Zobrazeno 30 z '+total+'.</p>':'')+'<p class="small muted">Zápasy v řadě za jeden klub v extralize včetně play off, kdy hráč nastoupil do každého zápasu týmu. „min.“ znamená, že série sahá až na začátek dostupných dat, takže skutečně může být delší. '
    +(V==='B'?'Hráč, který vynechal posledních 1–6 zápasů týmu po sérii aspoň 20 zápasů. Může jít o zranění, trest i odpočinek.':'')+'</p>';
  return {h:h,bind:function(){segBind('wvSeg',function(v){SS.wV=v});$('wC').onchange=function(){SS.wC=$('wC').value;renderS()}}};
}

/* ---------- Táhne tým? ---------- */
function strengthRank(){
  var TM=teamMatches(),pts={},gm={},seen={};
  Object.keys(TM).forEach(function(T){TM[T].forEach(function(m){
    if(m.season!==CUR||isPO(m)||m.sa==null||seen[T+m.key])return;seen[T+m.key]=1;
    var home=m.a===T,mine=home?m.sa:m.sb,th=home?m.sb:m.sa;
    gm[T]=(gm[T]||0)+1;pts[T]=(pts[T]||0)+(mine>th?(m.ot?2:3):(m.ot?1:0));
  })});
  var list=Object.keys(gm).filter(function(T){return gm[T]>=3}).sort(function(a,b){return pts[b]/gm[b]-pts[a]/gm[a]});
  var rank={};list.forEach(function(T,i){rank[T]=i+1});
  return {rank:rank,n:list.length,list:list};
}
function toolPull(){
  if(!allReady())return LOADING;
  var V=SS.xV,S=strengthRank(),top=Math.min(5,Math.floor(S.n/2)),low=S.n-top;
  var cfg={W:{a:['Ve výhrách','vyhráno',function(r){return won(r)===true}],b:['V prohrách','prohráno',function(r){return won(r)===false}],min:5,
              ta:'Bodují hlavně ve výhrách',tb:'Bodují víc v prohrách než ve výhrách'},
           H:{a:['Doma','doma',function(r){return r.team&&r.team===r.a}],b:['Venku','venku',function(r){return r.team&&r.team!==r.a}],min:6,ta:'Lepší doma',tb:'Lepší venku'},
           S:{a:['Proti silným','proti horním '+top,function(r){var o=opp(r);return o&&S.rank[o]&&S.rank[o]<=top}],b:['Proti slabým','proti dolním '+(S.n-low),function(r){var o=opp(r);return o&&S.rank[o]&&S.rank[o]>low}],min:5,ta:'Lepší proti silným soupeřům',tb:'Lepší proti slabým soupeřům'}}[V];
  var rows=[];
  Object.keys(EMB).forEach(function(n){
    if(SS.xC&&KLUB[n]!==SS.xC)return;
    var cur=INFR(n).filter(function(r){return r.season===CUR});if(cur.length<10)return;
    var A1=cur.filter(cfg.a[2]),B1=cur.filter(cfg.b[2]);if(A1.length<cfg.min||B1.length<cfg.min)return;
    var a=agg(A1),b=agg(B1),va=a.b/a.z,vb=b.b/b.z;
    rows.push({n:n,a:a,b:b,va:va,vb:vb,d:va-vb,pa:A1.filter(function(r){return r.p>0}).length/A1.length,pb:B1.filter(function(r){return r.p>0}).length/B1.length});
  });
  var A2=rows.filter(function(x){return x.d>0}).sort(function(x,y){return y.d-x.d||(x.n<y.n?-1:1)}).slice(0,12),B2=rows.filter(function(x){return x.d<0}).sort(function(x,y){return x.d-y.d||(x.n<y.n?-1:1)}).slice(0,12);
  function pct(v){return Math.round(v*100)+' %'}
  function tb(list){return tbl(playerHead()+'<th>'+cfg.a[0]+'</th><th>'+cfg.b[0]+'</th><th>Rozdíl</th>',list.map(function(x,i){
    return '<tr>'+playerCells(i,x.n)+'<td><b>'+dc(x.va)+'</b> <span class="muted small">b/z · '+x.a.z+' z. · bodoval v '+pct(x.pa)+'</span></td><td><b>'+dc(x.vb)+'</b> <span class="muted small">b/z · '+x.b.z+' z. · bodoval v '+pct(x.pb)+'</span></td><td>'+sgn(x.d)+'</td></tr>'}).join(''))}
  var h=segHtml('xvSeg',[['W','Výhry × prohry'],['H','Doma × venku'],['S','Silní × slabí soupeři']],V)+'<div class="sctl">'+clubSel('xC',SS.xC)+'</div>';
  if(!rows.length)h+='<p class="muted">Zatím není dost zápasů (aspoň '+cfg.min+' v každé skupině a 10 celkem).</p>';
  else{
    h+=sect(cfg.ta,A2.length?tb(A2):'');
    h+=sect(cfg.tb,B2.length?tb(B2):'');
  }
  h+='<p class="small muted">Aktuální sezóna '+seasonLabel(CUR)+', hráči od 10 zápasů, v každé skupině aspoň '+cfg.min+'. Body na zápas (G+A). '
    +(V==='S'?'Síla soupeřů je pořadí podle bodů v základní části letošní sezóny (horních '+top+' a dolních '+(S.n-low)+' z '+S.n+' týmů).':'')
    +(V==='W'?'Výhry a prohry týmu podle skóre zápasu (prodloužení a nájezdy počítány jako výhra, resp. prohra).':'')+'</p>';
  return {h:h,bind:function(){segBind('xvSeg',function(v){SS.xV=v});$('xC').onchange=function(){SS.xC=$('xC').value;renderS()}}};
}

/* ---------- Tento den ---------- */
function isoToday(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function mdDiff(a,b){ // rozdíl ve dnech mezi měsícem a dnem (stejný rok 2000)
  var x=new Date(2000,+a.slice(5,7)-1,+a.slice(8,10)),y=new Date(2000,+b.slice(5,7)-1,+b.slice(8,10));
  var d=Math.abs(Math.round((x-y)/864e5));return Math.min(d,366-d)}
function yearsTxt(n){return n+' '+(n===1?'rok':(n>=2&&n<=4?'roky':'let'))}
function toolDay(){
  if(!allReady())return LOADING;
  var sd=SS.nD||isoToday(),W=SS.nW,sy=+sd.slice(0,4),M={};
  Object.keys(EMB).forEach(function(n){EMB[n].forEach(function(r){
    if(+r.dt.slice(0,4)===sy||mdDiff(r.dt,sd)>W)return;
    var k=mkey(r),m=M[k]||(M[k]={r:r,P:[],G:[]});m.P.push({n:n,g:r.g,a:r.as,p:r.p});
  })});
  Object.keys(EMBG).forEach(function(n){EMBG[n].forEach(function(r){var m=M[mkey(r)];if(m&&r.p===0&&r.g>=55)m.G.push(n)})});
  var L=Object.keys(M).map(function(k){var m=M[k];m.P.sort(function(a,b){return b.p-a.p||b.g-a.g||(a.n<b.n?-1:1)});
    var hats=m.P.filter(function(x){return x.g>=3}),top=m.P[0];m.score=(hats.length?5:0)+(top?top.p:0)+(m.G.length?2:0);m.hats=hats;return m})
    .sort(function(a,b){return b.score-a.score||cmpDt(b.r.dt,a.r.dt)}),total=L.length;
  L=L.slice(0,20);
  /* výročí */
  var an=[];
  Object.keys(EMB).forEach(function(n){
    var all=INFR(n).slice().sort(function(x,y){return cmpDt(x.dt,y.dt)});if(!all.length)return;
    var act=all[all.length-1].season===CUR;if(!act)return;
    function chk(r,type){var yy=sy-(+r.dt.slice(0,4));if(yy>=1&&mdDiff(r.dt,sd)<=W)an.push({n:n,type:type,r:r,y:yy})}
    var f=all[0];
    if(f.season>dataStart()){chk(f,'Debut v extralize');var fg=all.filter(function(r){return r.g>0})[0];if(fg)chk(fg,'První gól')}
    all.forEach(function(r){if(r.g>=3&&!(f===r&&false))chk(r,'Hattrick')});
  });
  an.sort(function(a,b){return ((b.y%5===0)-(a.y%5===0))||b.y-a.y||(a.n<b.n?-1:1)});
  var ant=an.length;an=an.slice(0,25);
  var h='<div class="sctl"><label for="nD">Datum</label><input type="date" id="nD" value="'+sd+'"><label for="nW">Okolí</label>'+sel('nW',[0,1,3,7],W,function(v){return v?('± '+v+' '+(v===1?'den':'dní')):'přesně ten den'})+'</div>';
  h+=sect('Výročí hráčů',an.length?'<ul class="kl">'+an.map(function(x){var o=opp(x.r);
    return '<li><span class="tag">'+x.type+'</span> <b>'+plink(x.n)+'</b> <span class="muted">'+(KLUB[x.n]||'')+'</span> – '+(x.y%5===0?'<b>'+rokTxt(x.y)+'</b>':rokTxt(x.y))+' <span class="muted">('+fdate(x.r.dt)+(o?', proti '+o:'')+(x.type==='Hattrick'?', '+x.r.g+' góly':'')+')</span></li>'}).join('')+'</ul>':'',
    'Hráči, kteří hrají i letos. Debut a první gól jen u těch, jejichž první zápas v datech spadá po nejstarší dostupné sezóně ('+seasonLabel(dataStart())+'). Kulatá výročí jsou tučně.'+(ant>an.length?' Zobrazeno 25 z '+ant+'.':''));
  h+=sect('Zápasy v tento den v minulých sezónách',L.length?'<ul class="kl">'+L.map(function(m){var r=m.r,top=m.P.slice(0,3).filter(function(x){return x.p>0});
    return '<li><b>'+(+r.dt.slice(0,4))+'</b> · '+fdate(r.dt)+' · '+tdot(r.a)+'<b>'+r.a+'</b> – '+tdot(r.b)+'<b>'+r.b+'</b> '+(r.sa!=null?r.sa+':'+r.sb+(r.ot?' <span class="muted">pp</span>':''):'')
      +(m.hats.length?' · <span class="tag">hattrick</span> '+m.hats.map(function(x){return plink(x.n)+' ('+x.g+')'}).join(', '):'')
      +(top.length?'<div class="stx muted small">Nejlepší: '+top.map(function(x){return plink(x.n)+' '+x.g+'+'+x.a}).join(', ')+(m.G.length?' · nula: '+m.G.map(glink).join(', '):'')+'</div>':'')+'</li>'}).join('')+'</ul>':'',

SS.yV='U';SS.yC='';SS.rV='C';SS.rC='';
function mTeam(m,T){return T===m.a?[m.sa,m.sb]:[m.sb,m.sa]}
function mPts(m,T){var s=mTeam(m,T);return s[0]>s[1]?(m.ot?2:3):(m.ot?1:0)}
function aggTeam(ms,T){
  var t={z:ms.length,w:0,l:0,p:0,gf:0,ga:0};
  ms.forEach(function(m){var s=mTeam(m,T);if(s[0]>s[1])t.w++;else t.l++;t.p+=mPts(m,T);t.gf+=s[0];t.ga+=s[1]});
  t.pz=t.z?t.p/t.z:0;return t;
}

function expand(a){return {dt:a[0],kolo:a[1],comp:a[2],a:a[3],b:a[4],sa:a[5],sb:a[6],ot:!!a[7],g:a[8],as:a[9],p:a[10],pm:a[11],tm:a[12],toi:a[13],season:a[14]}}

var NK={},IDK={};

  var m={};a.forEach(function(r){m[r.dt]=r});
  for(var i=0;i<b.length;i++){var r=b[i],q=m[r.dt];if(!q)continue;if(q.a!==r.a||q.b!==r.b||q.g!==r.g||q.as!==r.as||q.p!==r.p)return false}
  return true}
var COMPORD=['Základní část','Play off','O umístění'];
function normComp(c){c=c||'';if(/umístění|udržení|nadstav/i.test(c))return 'O umístění';if(/play\s*-?\s*(off|out)|baráž/i.test(c))return 'Play off';return 'Základní část'}
function addPlayer(kod,name,rows,id){

var LOADED={};

  if(EMBG[key]){
    if(id&&IDS['G:'+key]===id){var d1=lastDt(EMBG[key]),d2=lastDt(rows);EMBG[key]=mergeRows(EMBG[key],rows);if(d2>d1)KLUBG[key]=kod;return}
    key=name+' ('+kod+')'}

}
function getJson(url){return fetch(url,{cache:'no-cache'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})}
function ensure(kod){
  if(LOADED[kod])return LOADED[kod];
  LOADED[kod]=Promise.all([getJson('liga/'+kod+'.json'),kod==='CEB'?getJson('bilance_data.json'):Promise.resolve(null)]).then(function(res){
    var L=res[0],M=res[1];
    if(!L&&!M)throw new Error('liga/'+kod+'.json nenalezen');
    if(M&&M.hraci){Object.keys(M.hraci).forEach(function(n){addPlayer(kod,n,M.hraci[n],null)})}
    else if(L){Object.keys(L.hraci||{}).forEach(function(n){addPlayer(kod,n,L.hraci[n].map(expand),(L.idy||{})[n])})}
    if(L){Object.keys(L.brankari||{}).forEach(function(n){addGoalie(kod,n,L.brankari[n].map(expand),(L.idy||{})[n])})}
    var st=(L&&L.vygenerovano)||(M&&M.vygenerovano);if(st)STAMP[kod]=st;

var FIX=[],FIXMISS=[],FIXSEL=null,FIXLS='bilanceRozlosovani',FIXDATA=null;
var FALIAS=[['KOM','kometa'],['LIB','liberec|tygři|tygri'],['TRI','třinec|trinec|oceláři|ocelari'],['MHK','hradec|mountfield'],['PCE','pardubice'],['PLZ','plzeň|plzen|škoda|skoda'],['SPA','sparta'],['SLA','slavia'],['LIT','litvínov|litvinov|verva'],['KVA','karlovy|energie'],['OLO','olomouc'],['VIT','vítkovice|vitkovice|ridera'],['MBL','boleslav'],['KLA','kladno|rytíři|rytiri'],['ZLN','zlín|zlin|psg'],['CHM','chomutov|piráti|pirati'],['JIH','jihlava|dukla'],['ZNO','znojmo|orli'],['VHK','vsetín|vsetin'],['UNL','ústí|usti'],['CEB','budějovice|budejovice|motor']];
function codeOf(nm){
  nm=String(nm||'').trim();if(/^[A-Z]{2,4}$/.test(nm))return nm;
  var l=nm.toLowerCase(),i;for(i=0;i<FALIAS.length;i++)if(new RegExp(FALIAS[i][1]).test(l))return FALIAS[i][0];
  for(var k in TEAMS)if(TEAMS[k]&&l.indexOf(String(TEAMS[k]).toLowerCase())>-1)return k;
  return null;
}
function isoToday(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function isoPlus(iso,n){var m=iso.split('-'),d=new Date(+m[0],+m[1]-1,+m[2]+n);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fixNorm(raw){
  var arr=Array.isArray(raw)?raw:(raw&&raw.zapasy)||[],t=new Date(),sy=t.getMonth()>=6?t.getFullYear():t.getFullYear()-1,out=[],miss={};
  arr.forEach(function(z){
    var dn=z.d||z.domaci||'',hn=z.h||z.hoste||'',d=codeOf(dn),h=codeOf(hn);
    if(!d||!h){if(!d&&dn)miss[dn]=1;if(!h&&hn)miss[hn]=1;return}
    var dt=z.dt;if(!dt&&z.den&&z.mesic){var y=z.mesic>=7?sy:sy+1;dt=y+'-'+('0'+z.mesic).slice(-2)+'-'+('0'+z.den).slice(-2)}

  });

function tdotC(c){return '<i class="tdot" style="--tg:'+tcs(c)+'"></i>'}
function fixSide(X,Y,cut){
